    <style>
        #lineage-preloader {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #161b29 0%, #090b10 75%, #040508 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            color: #e8d8a8;
            user-select: none;
            transition: opacity 0.45s ease;
        }
        .preloader-frame {
            width: min(500px, 86vw);
            padding: 28px 30px;
            background: rgba(12, 15, 24, 0.94);
            border: 2px solid #d8b458;
            box-shadow: 0 0 32px rgba(0, 0, 0, 0.9), inset 0 0 18px rgba(216, 180, 88, 0.16);
            border-radius: 10px;
            text-align: center;
        }
        .preloader-title {
            font-size: 26px;
            font-weight: bold;
            color: #ffe088;
            text-shadow: 0 2px 8px #000, 0 0 12px rgba(255, 200, 80, 0.45);
            letter-spacing: 3px;
            margin-bottom: 6px;
        }
        .preloader-subtitle {
            font-size: 13px;
            color: #99b4d4;
            margin-bottom: 22px;
            letter-spacing: 1px;
        }
        .preloader-bar-outer {
            width: 100%;
            height: 22px;
            background: #080a0f;
            border: 2px solid #8a7038;
            border-radius: 11px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.85);
        }
        #preloader-bar-fill {
            width: 2%;
            height: 100%;
            background: linear-gradient(90deg, #1b5aa0 0%, #36a2eb 50%, #ffee77 100%);
            box-shadow: 0 0 14px rgba(80, 200, 255, 0.8);
            transition: width 0.15s ease-out;
        }
        #preloader-percent {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 1px 3px #000, 0 0 5px #000;
        }
        #preloader-status {
            margin-top: 14px;
            font-size: 13px;
            color: #d8cbb0;
            min-height: 20px;
        }
        .preloader-tip {
            margin-top: 10px;
            font-size: 11px;
            color: #778899;
        }
    </style>
</head>

    <script>
        function updatePreloaderUI(percent, statusText) {
            const p = Math.max(0, Math.min(100, Math.round(percent)));
            const fillEl = document.getElementById('preloader-bar-fill');
            const pctEl = document.getElementById('preloader-percent');
            const stEl = document.getElementById('preloader-status');
            if (fillEl) fillEl.style.width = p + '%';
            if (pctEl) pctEl.textContent = p + '%';
            if (statusText && stEl) stEl.textContent = statusText;
        }
        function hidePreloaderUI() {
            const el = document.getElementById('lineage-preloader');
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => { if (el && el.parentNode) el.style.display = 'none'; }, 460);
        }
    </script>

        function getAssetImage(fileName, textureKey, scene) {
            if (window.DecodedImages && window.DecodedImages[fileName]) {
                return window.DecodedImages[fileName];
            }
            if (scene && textureKey && scene.textures.exists(textureKey)) {

        // 將 Google Imagen 3.0 繪製的《天堂1》角色與怪物白底圖進行高精準去背、內孔鏤空與邊緣消鋸齒處理
        function extractLineageSubjectCanvas(srcImg, workSize, flipHoriz) {
            try {
                if (!srcImg || !srcImg.width) return null;
                const c = document.createElement('canvas');
                c.width = workSize;
                c.height = workSize;
                const ctx = c.getContext('2d', { willReadFrequently: true });
                if (flipHoriz) {
                    ctx.save();
                    ctx.translate(workSize, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(srcImg, 0, 0, workSize, workSize);
                    ctx.restore();
                } else {
                    ctx.drawImage(srcImg, 0, 0, workSize, workSize);
                }

                const imgData = ctx.getImageData(0, 0, workSize, workSize);
                const d = imgData.data;
                const total = workSize * workSize;
                const isBg = new Uint8Array(total);
                const queue = new Int32Array(total);
                let qHead = 0, qTail = 0;

                const isWhiteBg = (idx) => {
                    const p = idx * 4;
                    const r = d[p], g = d[p + 1], b = d[p + 2];
                    const max = r > g ? (r > b ? r : b) : (g > b ? g : b);
                    const min = r < g ? (r < b ? r : b) : (g < b ? g : b);
                    const sat = max - min;
                    const lum = (r + g + b) / 3;
                    return (lum >= 224 && sat <= 20) || (lum >= 238 && sat <= 30);
                };

                for (let x = 0; x < workSize; x++) {
                    const top = x;
                    const bot = (workSize - 1) * workSize + x;
                    if (isWhiteBg(top)) { isBg[top] = 1; queue[qTail++] = top; }
                    if (isWhiteBg(bot)) { isBg[bot] = 1; queue[qTail++] = bot; }
                }
                for (let y = 0; y < workSize; y++) {
                    const left = y * workSize;
                    const right = y * workSize + (workSize - 1);
                    if (!isBg[left] && isWhiteBg(left)) { isBg[left] = 1; queue[qTail++] = left; }
                    if (!isBg[right] && isWhiteBg(right)) { isBg[right] = 1; queue[qTail++] = right; }
                }

                // 偵測弓弦、雙腿、肋骨、翅膀間隙內的純白封閉區塊 (2x2 純白無色偏)
                for (let y = 2; y < workSize - 2; y++) {
                    for (let x = 2; x < workSize - 2; x++) {
                        const idx = y * workSize + x;
                        if (isBg[idx]) continue;
                        let pureBlock = true;
                        for (let dy = 0; dy <= 1 && pureBlock; dy++) {
                            for (let dx = 0; dx <= 1 && pureBlock; dx++) {
                                const p = ((y + dy) * workSize + (x + dx)) * 4;
                                const r = d[p], g = d[p + 1], b = d[p + 2];
                                const max = r > g ? (r > b ? r : b) : (g > b ? g : b);
                                const min = r < g ? (r < b ? r : b) : (g < b ? g : b);
                                if (r < 245 || g < 245 || b < 245 || (max - min) > 6) pureBlock = false;
                            }
                        }
                        if (pureBlock) {
                            isBg[idx] = 1;
                            queue[qTail++] = idx;
                        }
                    }
                }

                const dxArr = [-1, 1, 0, 0, -1, -1, 1, 1];
                const dyArr = [0, 0, -1, 1, -1, 1, -1, 1];
                while (qHead < qTail) {
                    const cur = queue[qHead++];
                    const cx = cur % workSize;
                    const cy = (cur / workSize) | 0;
                    for (let dir = 0; dir < 8; dir++) {
                        const nx = cx + dxArr[dir];
                        const ny = cy + dyArr[dir];
                        if (nx >= 0 && nx < workSize && ny >= 0 && ny < workSize) {
                            const nIdx = ny * workSize + nx;
                            if (!isBg[nIdx] && isWhiteBg(nIdx)) {
                                isBg[nIdx] = 1;
                                queue[qTail++] = nIdx;
                            }
                        }
                    }
                }

                let minX = workSize, minY = workSize, maxX = 0, maxY = 0;
                for (let y = 0; y < workSize; y++) {
                    for (let x = 0; x < workSize; x++) {
                        const idx = y * workSize + x;
                        const p = idx * 4;
                        if (isBg[idx]) {
                            d[p + 3] = 0;
                        } else {
                            let bgNeighbors = 0;
                            for (let dir = 0; dir < 8; dir++) {
                                const nx = x + dxArr[dir];
                                const ny = y + dyArr[dir];
                                if (nx < 0 || nx >= workSize || ny < 0 || ny >= workSize || isBg[ny * workSize + nx]) {
                                    bgNeighbors++;
                                }
                            }
                            let r = d[p], g = d[p + 1], b = d[p + 2], alpha = 255;
                            if (bgNeighbors > 0) {
                                const lum = (r + g + b) / 3;
                                if (lum > 162) {
                                    alpha = Math.max(0, 255 - ((lum - 140) * 3.1) | 0);
                                    r = (r * 0.58) | 0;
                                    g = (g * 0.58) | 0;
                                    b = (b * 0.58) | 0;
                                }
                            }
                            if (alpha > 14) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                d[p] = r; d[p + 1] = g; d[p + 2] = b; d[p + 3] = alpha;
                            } else {
                                d[p + 3] = 0;
                            }
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                const cropW = Math.max(1, maxX - minX + 1);
                const cropH = Math.max(1, maxY - minY + 1);
                const out = document.createElement('canvas');
                out.width = cropW;
                out.height = cropH;
                out.getContext('2d').drawImage(c, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
                return out;
            } catch (e) {
                console.warn('extractLineageSubjectCanvas failed:', e);
                return null;
            }
        }

        // 將去背後的《天堂1》角色合成為 16 幀 (8行x2列: 0..7 流暢步伐行走, 8..15 蓄力斬擊/神射/施法連段) 高解析序列圖
        function buildLineageCharacterSheet(scene, key, rawFileName, fallbackFileName, flipHoriz, classType) {
            const rawImg = getAssetImage(rawFileName, key, scene);
            const cleanSubject = rawImg ? extractLineageSubjectCanvas(rawImg, 300, flipHoriz) : null;
            if (!cleanSubject) {
                return false;
            }

            const fw = 112;
            const fh = 128;
            const cols = 8;
            const rows = 2;
            const sheet = document.createElement('canvas');
            sheet.width = fw * cols;
            sheet.height = fh * rows;
            const sCtx = sheet.getContext('2d');

            const sw = cleanSubject.width;
            const sh = cleanSubject.height;
            const fitScale = Math.min((fw * 0.72) / sw, (fh * 0.78) / sh);
            const drawW = Math.round(sw * fitScale);
            const drawH = Math.round(sh * fitScale);
            const waistSplit = Math.round(sh * 0.57);
            const drawWaist = Math.round(drawH * 0.57);

            // Row 0: Frames 0..7 擬真關節步態行走動畫 (分離軀幹與雙腿交替邁步 + 披風與重心起伏)
            for (let f = 0; f < 8; f++) {
                const ox = f * fw;
                const oy = 0;
                const phase = (f / 8) * Math.PI * 2;
                const stride = Math.sin(phase);
                const bob = -Math.abs(Math.sin(phase)) * 3.2;
                const baseX = ox + Math.round((fw - drawW) / 2);
                const baseY = oy + fh - drawH - 8;

                // 腳底柔和接地陰影
                sCtx.save();
                sCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                sCtx.beginPath();
                sCtx.ellipse(ox + fw * 0.5, oy + fh - 10, drawW * 0.34, 8, 0, 0, Math.PI * 2);
                sCtx.fill();
                sCtx.restore();

                // 下半身雙腿交替邁步 (左半與右半反向步幅與抬腳)
                const halfSrcW = Math.floor(sw / 2);
                const halfDrawW = Math.floor(drawW / 2);
                const leftLegDx = Math.round(stride * 3.5);
                const leftLegDy = Math.round(Math.max(0, -stride) * -2.8);
                const rightLegDx = Math.round(-stride * 3.5);
                const rightLegDy = Math.round(Math.max(0, stride) * -2.8);

                // 後腿與前腿繪製
                sCtx.drawImage(
                    cleanSubject,
                    0, waistSplit, halfSrcW, sh - waistSplit,
                    baseX + leftLegDx, baseY + drawWaist + leftLegDy, halfDrawW, drawH - drawWaist
                );
                sCtx.drawImage(
                    cleanSubject,
                    halfSrcW, waistSplit, sw - halfSrcW, sh - waistSplit,
                    baseX + halfDrawW + rightLegDx, baseY + drawWaist + rightLegDy, drawW - halfDrawW, drawH - drawWaist
                );

                // 上半身軀幹與武器 (微幅前傾與呼吸律動)
                sCtx.save();
                const pivotX = baseX + drawW * 0.5 + stride * 1.2;
                const pivotY = baseY + drawWaist + bob;
                sCtx.translate(pivotX, pivotY);
                sCtx.rotate((2.2 + stride * 2.0) * Math.PI / 180);
                sCtx.drawImage(
                    cleanSubject,
                    0, 0, sw, waistSplit + 6,
                    -drawW * 0.5, -drawWaist, drawW, drawWaist + 5
                );
                sCtx.restore();
            }

            // Row 1: Frames 8..15 流暢《天堂1》連段攻擊動畫 (蓄力 -> 突進揮砍/拉弓/施法 -> 刀光/箭芒/魔法陣爆發 -> 收招)
            const atkPoses = [
                { dx: -4, dy: -1, rot: -7,  legSpread: -2, fx: 0.1 }, // Frame 8: 起手蓄力
                { dx: -7, dy: -3, rot: -13, legSpread: -3, fx: 0.3 }, // Frame 9: 蓄力頂點
                { dx:  6, dy: -2, rot:  8,  legSpread:  4, fx: 0.7 }, // Frame 10: 疾速揮擊
                { dx: 12, dy:  1, rot: 16,  legSpread:  6, fx: 1.0 }, // Frame 11: 斬擊/神射/奧術爆發頂點
                { dx: 10, dy:  1, rot: 12,  legSpread:  5, fx: 0.8 }, // Frame 12: 劍氣/箭氣延伸
                { dx:  6, dy:  0, rot:  6,  legSpread:  3, fx: 0.4 }, // Frame 13: 收勢
                { dx:  3, dy:  0, rot:  3,  legSpread:  1, fx: 0.15}, // Frame 14: 回防
                { dx:  0, dy:  0, rot:  0,  legSpread:  0, fx: 0.0 }  // Frame 15: 戰鬥待命
            ];

            for (let f = 0; f < 8; f++) {
                const pose = atkPoses[f];
                const ox = f * fw;
                const oy = fh;
                const baseX = ox + Math.round((fw - drawW) / 2) + Math.round(pose.dx * 0.5);
                const baseY = oy + fh - drawH - 8;

                // 腳底戰鬥踏步陰影
                sCtx.save();
                sCtx.fillStyle = 'rgba(0, 0, 0, 0.38)';
                sCtx.beginPath();
                sCtx.ellipse(ox + fw * 0.5 + pose.dx * 0.4, oy + fh - 10, drawW * 0.36 + Math.abs(pose.legSpread), 8.5, 0, 0, Math.PI * 2);
                sCtx.fill();
                sCtx.restore();

                // 下半身弓步支撐
                const halfSrcW = Math.floor(sw / 2);
                const halfDrawW = Math.floor(drawW / 2);
                sCtx.drawImage(
                    cleanSubject,
                    0, waistSplit, halfSrcW, sh - waistSplit,
                    baseX - Math.round(pose.legSpread * 0.5), baseY + drawWaist, halfDrawW, drawH - drawWaist
                );
                sCtx.drawImage(
                    cleanSubject,
                    halfSrcW, waistSplit, sw - halfSrcW, sh - waistSplit,
                    baseX + halfDrawW + pose.legSpread, baseY + drawWaist, drawW - halfDrawW, drawH - drawWaist
                );

                // 上半身扭腰揮擊
                sCtx.save();
                const pivotX = baseX + drawW * 0.5 + pose.dx * 0.55;
                const pivotY = baseY + drawWaist + pose.dy;
                sCtx.translate(pivotX, pivotY);
                sCtx.rotate((pose.rot * Math.PI) / 180);
                sCtx.drawImage(
                    cleanSubject,
                    0, 0, sw, waistSplit + 6,
                    -drawW * 0.5, -drawWaist, drawW, drawWaist + 5
                );
                sCtx.restore();

                // 繪製職業專屬《天堂1》攻擊光效 (內嵌於攻擊幀 9~13，讓揮刀與射擊視覺無比流暢)
                if (pose.fx >= 0.25) {
                    sCtx.save();
                    if (classType === 'knight') {
                        // 騎士：銀白與烈焰紅雙層新月劍氣斬弧
                        const arcCx = ox + fw * 0.52;
                        const arcCy = oy + fh * 0.52;
                        const arcR = 40;
                        const startA = -1.15 + (f - 2) * 0.18;
                        const endA = 0.95 + (f - 2) * 0.15;
                        sCtx.strokeStyle = `rgba(255, 70, 40, ${pose.fx * 0.78})`;
                        sCtx.lineWidth = 7 * pose.fx;
                        sCtx.lineCap = 'round';
                        sCtx.beginPath();
                        sCtx.arc(arcCx, arcCy, arcR, startA, endA);
                        sCtx.stroke();

                        sCtx.strokeStyle = `rgba(255, 250, 220, ${pose.fx * 0.95})`;
                        sCtx.lineWidth = 3.2 * pose.fx;
                        sCtx.beginPath();
                        sCtx.arc(arcCx + 2, arcCy, arcR - 2, startA + 0.08, endA - 0.05);
                        sCtx.stroke();
                    } else if (classType === 'elf') {
                        // 妖精：翠綠黃金「風之神射」拉弓聚氣與音爆光環
                        const bowX = ox + fw * 0.74;
                        const bowY = oy + fh * 0.48;
                        const grad = sCtx.createRadialGradient(bowX, bowY, 2, bowX, bowY, 24 * pose.fx);
                        grad.addColorStop(0, `rgba(255, 255, 210, ${pose.fx})`);
                        grad.addColorStop(0.5, `rgba(100, 255, 160, ${pose.fx * 0.75})`);
                        grad.addColorStop(1, 'rgba(0, 200, 100, 0)');
                        sCtx.fillStyle = grad;
                        sCtx.beginPath();
                        sCtx.arc(bowX, bowY, 24 * pose.fx, 0, Math.PI * 2);
                        sCtx.fill();

                        if (f >= 2 && f <= 4) {
                            sCtx.strokeStyle = `rgba(220, 255, 180, ${pose.fx * 0.9})`;
                            sCtx.lineWidth = 2.5;
                            sCtx.beginPath();
                            sCtx.moveTo(bowX - 18, bowY);
                            sCtx.lineTo(bowX + 16, bowY);
                            sCtx.stroke();
                        }
                    } else if (classType === 'mage') {
                        // 法師：水晶魔杖頂端奧術藍金符文光環爆發
                        const staffX = ox + fw * 0.73;
                        const staffY = oy + fh * 0.34;
                        const grad = sCtx.createRadialGradient(staffX, staffY, 2, staffX, staffY, 26 * pose.fx);
                        grad.addColorStop(0, `rgba(255, 255, 255, ${pose.fx})`);
                        grad.addColorStop(0.45, `rgba(80, 200, 255, ${pose.fx * 0.85})`);
                        grad.addColorStop(1, 'rgba(30, 80, 255, 0)');
                        sCtx.fillStyle = grad;
                        sCtx.beginPath();
                        sCtx.arc(staffX, staffY, 26 * pose.fx, 0, Math.PI * 2);
                        sCtx.fill();

                        sCtx.strokeStyle = `rgba(255, 220, 100, ${pose.fx * 0.75})`;
                        sCtx.lineWidth = 1.8;
                        sCtx.beginPath();
                        sCtx.arc(staffX, staffY, 15 * pose.fx, 0, Math.PI * 2);
                        sCtx.stroke();
                    }
                    sCtx.restore();
                }
            }

            if (scene.textures.exists(key)) scene.textures.remove(key);
            scene.textures.addSpriteSheet(key, sheet, { frameWidth: fw, frameHeight: fh });
            return true;
        }

        // 將去背後的《天堂1》怪物合成為 8 幀 (4行x2列: 0..3 行走/律動動畫, 4..7 兇猛撲擊/揮砍動畫) 序列圖
        function buildLineageMonsterSheet(scene, mData) {
            const rawImg = getAssetImage(mData.rawAsset || mData.image, mData.id, scene);
            const cleanSubject = rawImg ? extractLineageSubjectCanvas(rawImg, 300, !!mData.flipHoriz) : null;
            if (!cleanSubject) return false;

            const frameDim = mData.isBoss ? 160 : 128;
            const cols = 4;
            const rows = 2;
            const sheet = document.createElement('canvas');
            sheet.width = frameDim * cols;
            sheet.height = frameDim * rows;
            const sCtx = sheet.getContext('2d');

            const sw = cleanSubject.width;
            const sh = cleanSubject.height;
            const fitScale = Math.min((frameDim * 0.76) / sw, (frameDim * 0.78) / sh);
            const drawW = Math.round(sw * fitScale);
            const drawH = Math.round(sh * fitScale);

            // Row 0: Frames 0..3 怪物移動與呼吸步伐
            for (let f = 0; f < 4; f++) {
                const ox = f * frameDim;
                const oy = 0;
                const phase = (f / 4) * Math.PI * 2;
                const stride = Math.sin(phase);
                const cx = ox + frameDim * 0.5;
                const footY = oy + frameDim - 10;

                // 腳底陰影
                sCtx.save();
                sCtx.fillStyle = mData.isBoss ? 'rgba(20, 0, 0, 0.45)' : 'rgba(0, 0, 0, 0.34)';
                sCtx.beginPath();
                sCtx.ellipse(cx, footY, drawW * 0.36, mData.isBoss ? 11 : 8, 0, 0, Math.PI * 2);
                sCtx.fill();
                sCtx.restore();

                if (mData.id === 'slime') {
                    // 史萊姆：果凍彈性擠壓與拉伸
                    const sx = 1.0 + stride * 0.08;
                    const sy = 1.0 - stride * 0.08;
                    const w = drawW * sx;
                    const h = drawH * sy;
                    sCtx.drawImage(cleanSubject, cx - w * 0.5, footY - h, w, h);
                } else {
                    // 一般與 Boss 怪物：上下半身微幅邁步與威壓律動
                    const waistSrc = Math.round(sh * 0.58);
                    const waistDraw = Math.round(drawH * 0.58);
                    const bob = -Math.abs(stride) * 3.0;
                    const baseX = Math.round(cx - drawW * 0.5);
                    const baseY = Math.round(footY - drawH);

                    // 下肢交替
                    const halfSrcW = Math.floor(sw / 2);
                    const halfDrawW = Math.floor(drawW / 2);
                    sCtx.drawImage(
                        cleanSubject,
                        0, waistSrc, halfSrcW, sh - waistSrc,
                        baseX + Math.round(stride * 3), baseY + waistDraw, halfDrawW, drawH - waistDraw
                    );
                    sCtx.drawImage(
                        cleanSubject,
                        halfSrcW, waistSrc, sw - halfSrcW, sh - waistSrc,
                        baseX + halfDrawW - Math.round(stride * 3), baseY + waistDraw, drawW - halfDrawW, drawH - waistDraw
                    );

                    // 上軀幹
                    sCtx.save();
                    sCtx.translate(cx + stride * 1.5, baseY + waistDraw + bob);
                    sCtx.rotate((stride * 2.5 * Math.PI) / 180);
                    sCtx.drawImage(cleanSubject, 0, 0, sw, waistSrc + 6, -drawW * 0.5, -waistDraw, drawW, waistDraw + 5);
                    sCtx.restore();
                }
            }

            // Row 1: Frames 4..7 怪物兇猛攻擊連段 (蓄力 -> 撲擊揮爪/斬擊 -> 爪痕/烈焰刀光 -> 收勢)
            const mAtkPoses = [
                { dx: -5, dy: -2, rot: -8,  fx: 0.2 },
                { dx: 11, dy: -1, rot: 14,  fx: 1.0 },
                { dx:  7, dy:  1, rot:  8,  fx: 0.6 },
                { dx:  0, dy:  0, rot:  0,  fx: 0.0 }
            ];
            for (let f = 0; f < 4; f++) {
                const pose = mAtkPoses[f];
                const ox = f * frameDim;
                const oy = frameDim;
                const cx = ox + frameDim * 0.5 + pose.dx * 0.5;
                const footY = oy + frameDim - 10;

                sCtx.save();
                sCtx.fillStyle = mData.isBoss ? 'rgba(40, 0, 0, 0.48)' : 'rgba(0, 0, 0, 0.36)';
                sCtx.beginPath();
                sCtx.ellipse(cx, footY, drawW * 0.38, mData.isBoss ? 11 : 8, 0, 0, Math.PI * 2);
                sCtx.fill();
                sCtx.restore();

                sCtx.save();
                sCtx.translate(cx, footY - drawH * 0.42 + pose.dy);
                sCtx.rotate((pose.rot * Math.PI) / 180);
                sCtx.drawImage(cleanSubject, -drawW * 0.5, -drawH * 0.58, drawW, drawH);
                sCtx.restore();

                if (pose.fx > 0.3 && !mData.isRanged) {
                    sCtx.save();
                    const slashColor = mData.isBoss ? `rgba(255, 80, 20, ${pose.fx * 0.85})` : `rgba(255, 210, 140, ${pose.fx * 0.75})`;
                    sCtx.strokeStyle = slashColor;
                    sCtx.lineWidth = (mData.isBoss ? 5.5 : 3.5) * pose.fx;
                    sCtx.lineCap = 'round';
                    sCtx.beginPath();
                    sCtx.arc(ox + frameDim * 0.56, oy + frameDim * 0.52, frameDim * 0.30, -0.9, 0.85);
                    sCtx.stroke();
                    sCtx.restore();
                }
            }

            if (scene.textures.exists(mData.id)) scene.textures.remove(mData.id);
            scene.textures.addSpriteSheet(mData.id, sheet, { frameWidth: frameDim, frameHeight: frameDim });
            return true;
        }

        // 將 Google Imagen 3.0 繪製於純黑底 (#000000) 的《天堂1》魔法與遠程特效圖進行高動態範圍輝光去背 (Luminance-to-Alpha + Unpremultiply)
        function extractLineageVfxCanvas(srcImg, workW, workH, cropPadding = 0.04) {
            try {
                if (!srcImg || !srcImg.width) return null;
                const c = document.createElement('canvas');
                c.width = workW;
                c.height = workH;
                const ctx = c.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(srcImg, 0, 0, workW, workH);

                const imgData = ctx.getImageData(0, 0, workW, workH);
                const data = imgData.data;

                let minX = workW, minY = workH, maxX = 0, maxY = 0;

                for (let y = 0; y < workH; y++) {
                    for (let x = 0; x < workW; x++) {
                        const idx = (y * workW + x) * 4;
                        const r = data[idx], g = data[idx + 1], b = data[idx + 2];
                        const maxC = Math.max(r, g, b);
                        const sumC = r + g + b;

                        if (maxC <= 10 || sumC <= 18) {
                            data[idx + 3] = 0;
                            continue;
                        }

                        // 平滑映射亮度至透明度，完整保留半透明魔法光暈、火焰與雷電絲線
                        let norm = Math.min(1, (maxC - 10) / 88);
                        let alpha = Math.min(255, Math.round(Math.pow(norm, 0.78) * 255));

                        // 反預乘還原飽和明亮的輝光色彩，避免黑底邊緣產生灰暗黑邊
                        const boost = 255 / Math.max(48, alpha);
                        data[idx]     = Math.min(255, Math.round(r * boost));
                        data[idx + 1] = Math.min(255, Math.round(g * boost));
                        data[idx + 2] = Math.min(255, Math.round(b * boost));
                        data[idx + 3] = alpha;

                        if (alpha > 28) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                if (maxX <= minX || maxY <= minY) return c;

                const bw = maxX - minX + 1;
                const bh = maxY - minY + 1;
                const padX = Math.round(bw * cropPadding);
                const padY = Math.round(bh * cropPadding);
                const sx = Math.max(0, minX - padX);
                const sy = Math.max(0, minY - padY);
                const sw = Math.min(workW - sx, bw + padX * 2);
                const sh = Math.min(workH - sy, bh + padY * 2);

                const cropped = document.createElement('canvas');
                cropped.width = sw;
                cropped.height = sh;
                const cCtx = cropped.getContext('2d');
                cCtx.drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh);
                return cropped;
            } catch (e) {
                console.warn('extractLineageVfxCanvas failed:', e);
                return null;
            }
        }

        // 將 Google Imagen 3.0 繪製的飛行投射物 (妖精之箭、法師魔力飛彈、火箭術、風刃、寒冰打擊、Boss暗黑火球) 合成為 8 幀流暢動態特效序列圖
        function buildLineageProjectileSheet(scene, texKey, rawAssetName, fallbackFile, styleType) {
            const srcImg = getAssetImage(rawAssetName, texKey, scene) || getAssetImage(fallbackFile, texKey, scene);
            if (!srcImg || !srcImg.width) return false;

            const cleanVfx = extractLineageVfxCanvas(srcImg, 360, 200, 0.05);
            if (!cleanVfx) return false;

            const frameW = 168;
            const frameH = 88;
            const totalFrames = 8;
            const sheet = document.createElement('canvas');
            sheet.width = frameW * totalFrames;
            sheet.height = frameH;
            const sCtx = sheet.getContext('2d');

            const aspect = cleanVfx.width / Math.max(1, cleanVfx.height);
            let baseW = frameW * 0.88;
            let baseH = baseW / aspect;
            if (baseH > frameH * 0.82) {
                baseH = frameH * 0.82;
                baseW = baseH * aspect;
            }

            for (let f = 0; f < totalFrames; f++) {
                const ox = f * frameW;
                const cy = frameH * 0.5;
                const phase = (f / totalFrames) * Math.PI * 2;
                const pulse = 1 + Math.sin(phase) * 0.05;
                const stretchX = 1 + Math.cos(phase) * 0.04;

                sCtx.save();
                sCtx.beginPath();
                sCtx.rect(ox, 0, frameW, frameH);
                sCtx.clip();

                // 繪製底層動態能量尾流與光暈
                const tipX = ox + frameW * 0.84;
                if (styleType === 'elf_arrow' || styleType === 'wind_blade') {
                    // 妖精風靈之箭 / 一級魔法風刃：翠綠與青色螺旋風靈氣流 + 星光粒子
                    const grad = sCtx.createLinearGradient(ox + 12, cy, tipX, cy);
                    grad.addColorStop(0, 'rgba(20, 255, 160, 0)');
                    grad.addColorStop(0.55, 'rgba(60, 255, 190, 0.34)');
                    grad.addColorStop(1, 'rgba(200, 255, 245, 0.75)');
                    sCtx.strokeStyle = grad;
                    sCtx.lineWidth = styleType === 'wind_blade' ? 4.2 : 3.2;
                    for (let w = -1; w <= 1; w += 2) {
                        sCtx.beginPath();
                        for (let x = 0; x <= 110; x += 6) {
                            const px = tipX - x;
                            const py = cy + Math.sin(phase * 1.5 + x * 0.09) * ((styleType === 'wind_blade' ? 13 : 9) * w * (1 - x / 130));
                            if (x === 0) sCtx.moveTo(px, py);
                            else sCtx.lineTo(px, py);
                        }
                        sCtx.stroke();
                    }
                } else if (styleType === 'mage_bolt' || styleType === 'ice_shard') {
                    // 法師一般攻擊 (魔力飛彈) / 三級魔法寒冰打擊：寶石藍與冰晶奧術脈衝
                    const auraGrad = sCtx.createRadialGradient(tipX - 18, cy, 2, tipX - 24, cy, 42 * pulse);
                    auraGrad.addColorStop(0, 'rgba(230, 255, 255, 0.90)');
                    auraGrad.addColorStop(0.45, styleType === 'ice_shard' ? 'rgba(60, 210, 255, 0.52)' : 'rgba(60, 160, 255, 0.40)');
                    auraGrad.addColorStop(1, 'rgba(40, 90, 255, 0)');
                    sCtx.fillStyle = auraGrad;
                    sCtx.beginPath();
                    sCtx.arc(tipX - 20, cy, 42 * pulse, 0, Math.PI * 2);
                    sCtx.fill();
                } else if (styleType === 'fire_arrow') {
                    // 火箭術 / 燃燒的火球：烈焰紅金火舌尾流
                    const fireGrad = sCtx.createRadialGradient(tipX - 16, cy, 3, tipX - 28, cy, 46 * pulse);
                    fireGrad.addColorStop(0, 'rgba(255, 255, 210, 0.90)');
                    fireGrad.addColorStop(0.4, 'rgba(255, 140, 20, 0.50)');
                    fireGrad.addColorStop(1, 'rgba(220, 20, 0, 0)');
                    sCtx.fillStyle = fireGrad;
                    sCtx.beginPath();
                    sCtx.arc(tipX - 22, cy, 46 * pulse, 0, Math.PI * 2);
                    sCtx.fill();
                } else if (styleType === 'boss_fireball') {
                    // Boss 暗黑煉獄火球：深淵紫紅魔焰核心
                    const bossGrad = sCtx.createRadialGradient(tipX - 22, cy, 4, tipX - 26, cy, 44 * pulse);
                    bossGrad.addColorStop(0, 'rgba(255, 190, 255, 0.85)');
                    bossGrad.addColorStop(0.5, 'rgba(190, 20, 220, 0.45)');
                    bossGrad.addColorStop(1, 'rgba(80, 0, 110, 0)');
                    sCtx.fillStyle = bossGrad;
                    sCtx.beginPath();
                    sCtx.arc(tipX - 24, cy, 44 * pulse, 0, Math.PI * 2);
                    sCtx.fill();
                }

                // 繪製 Google Imagen 3.0 主體投射物並加入動態呼吸縮放與微幅震盪
                const drawW = baseW * stretchX;
                const drawH = baseH * pulse;
                const drawX = ox + (frameW - drawW) * 0.54;
                const drawY = cy - drawH * 0.5 + Math.sin(phase) * 1.2;
                sCtx.drawImage(cleanVfx, drawX, drawY, drawW, drawH);

                // 繪製頂層高光閃耀細節 (箭簇星芒 / 奧術電弧 / 飛散火星 / 冰晶雪芒)
                if (styleType === 'elf_arrow' || styleType === 'wind_blade') {
                    const starR = (styleType === 'wind_blade' ? 11 : 8) + (f % 2) * 4;
                    sCtx.strokeStyle = 'rgba(220, 255, 245, 0.94)';
                    sCtx.lineWidth = 2.0;
                    sCtx.beginPath();
                    sCtx.moveTo(tipX - starR, cy); sCtx.lineTo(tipX + starR, cy);
                    sCtx.moveTo(tipX, cy - starR * 0.7); sCtx.lineTo(tipX, cy + starR * 0.7);
                    sCtx.stroke();
                } else if (styleType === 'mage_bolt' || styleType === 'ice_shard') {
                    sCtx.strokeStyle = styleType === 'ice_shard' ? 'rgba(210, 250, 255, 0.95)' : ((f % 2 === 0) ? 'rgba(190, 245, 255, 0.92)' : 'rgba(180, 130, 255, 0.90)');
                    sCtx.lineWidth = 1.8;
                    sCtx.beginPath();
                    for (let seg = 0; seg < 5; seg++) {
                        const lx = tipX - 6 - seg * 20;
                        const ly = cy + ((seg % 2 === 0 ? 1 : -1) * (5 + ((f * 3 + seg * 5) % 8)));
                        if (seg === 0) sCtx.moveTo(tipX, cy);
                        else sCtx.lineTo(lx, ly);
                    }
                    sCtx.stroke();
                } else if (styleType === 'fire_arrow') {
                    for (let p = 0; p < 5; p++) {
                        const px = tipX - 18 - ((f * 14 + p * 23) % 95);
                        const py = cy + Math.sin(phase + p * 1.7) * (6 + (p % 3) * 4);
                        sCtx.fillStyle = (p % 2 === 0) ? 'rgba(255, 250, 180, 0.95)' : 'rgba(255, 120, 20, 0.90)';
                        sCtx.beginPath();
                        sCtx.arc(px, py, 2.2 - (p * 0.25), 0, Math.PI * 2);
                        sCtx.fill();
                    }
                }
                sCtx.restore();
            }

            if (scene.textures.exists(texKey)) scene.textures.remove(texKey);
            scene.textures.addSpriteSheet(texKey, sheet, { frameWidth: frameW, frameHeight: frameH });
            return true;
        }

        // 將 1~8 級共 34 種魔法各自專屬的特效原畫合成為 12 幀 (4x3 網格，相容手機/平板 WebGL 2048 貼圖限制) 華麗施法動畫序列圖
        function buildLineageSpellSheet(scene, texKey, rawAssetName, fallbackFile, spellStyle) {
            const srcImg = getAssetImage(rawAssetName, texKey, scene) || getAssetImage(fallbackFile, texKey, scene);
            if (!srcImg || !srcImg.width) return false;

            const cleanVfx = extractLineageVfxCanvas(srcImg, 340, 340, 0.03);
            if (!cleanVfx) return false;

            const frameW = 260;
            const frameH = 280;
            const totalFrames = 12;
            const cols = 4;
            const rows = 3;
            const sheet = document.createElement('canvas');
            sheet.width = frameW * cols;
            sheet.height = frameH * rows;
            const sCtx = sheet.getContext('2d');

            // 每個魔法皆擁有獨立的光環色系與專屬動態Overlay特效
            const spellMeta = (typeof MagicDict !== 'undefined' && MagicDict[spellStyle]) ? MagicDict[spellStyle] : null;
            const ringHex = (spellMeta && spellMeta.borderColor) ? spellMeta.borderColor : '#66ccff';

            for (let f = 0; f < totalFrames; f++) {
                const cellX = (f % cols) * frameW;
                const cellY = Math.floor(f / cols) * frameH;
                const ox = 0;
                const cx = frameW * 0.5;
                const cy = frameH * 0.54;
                const phase = (f / totalFrames) * Math.PI * 2;

                // 計算三階段動畫曲線：起手展開 (0..2) -> 巔峰爆發 (3..8) -> 餘韻消散 (9..11)
                let alpha = 1.0;
                let scaleX = 1.0;
                let scaleY = 1.0;
                let offsetY = 0;

                if (f === 0) { alpha = 0.58; scaleX = 0.50; scaleY = 0.38; offsetY = 24; }
                else if (f === 1) { alpha = 0.84; scaleX = 0.78; scaleY = 0.74; offsetY = 10; }
                else if (f === 2) { alpha = 0.96; scaleX = 0.95; scaleY = 0.96; offsetY = 2; }
                else if (f >= 3 && f <= 8) {
                    const wave = Math.sin(((f - 3) / 5) * Math.PI * 2);
                    alpha = 1.0;
                    scaleX = 1.0 + wave * 0.05;
                    scaleY = 1.0 - wave * 0.04;
                    offsetY = Math.cos(((f - 3) / 5) * Math.PI * 2) * 3;
                } else if (f === 9) { alpha = 0.88; scaleX = 1.06; scaleY = 1.05; offsetY = -4; }
                else if (f === 10) { alpha = 0.58; scaleX = 1.12; scaleY = 1.10; offsetY = -8; }
                else { alpha = 0.26; scaleX = 1.18; scaleY = 1.14; offsetY = -12; }

                sCtx.save();
                sCtx.translate(cellX, cellY);
                sCtx.beginPath();
                sCtx.rect(0, 0, frameW, frameH);
                sCtx.clip();
                sCtx.globalAlpha = alpha;

                // 1. 底部等距視角魔法陣動態旋轉光環与專屬幾何陣紋
                const ringY = frameH * 0.76;
                const ringRx = 96 * Math.min(1.15, scaleX * 1.08);
                const ringRy = 42 * Math.min(1.15, scaleX * 1.08);
                sCtx.save();
                sCtx.translate(cx, ringY);
                sCtx.strokeStyle = ringHex;
                sCtx.lineWidth = 2.8;
                sCtx.beginPath();
                sCtx.ellipse(0, 0, ringRx, ringRy, 0, 0, Math.PI * 2);
                sCtx.stroke();

                // 依魔法階位繪製不同頂點數的旋轉星芒陣紋
                const starPts = spellMeta ? (4 + (spellMeta.tier % 5) * 2) : 6;
                sCtx.lineWidth = 1.4;
                sCtx.strokeStyle = '#ffffff';
                for (let sp = 0; sp < starPts; sp++) {
                    const a1 = phase * 0.5 + (sp * Math.PI * 2) / starPts;
                    const a2 = phase * 0.5 + (((sp + 2) % starPts) * Math.PI * 2) / starPts;
                    sCtx.beginPath();
                    sCtx.moveTo(Math.cos(a1) * ringRx * 0.78, Math.sin(a1) * ringRy * 0.78);
                    sCtx.lineTo(Math.cos(a2) * ringRx * 0.78, Math.sin(a2) * ringRy * 0.78);
                    sCtx.stroke();
                }
                sCtx.restore();

                // 2. 繪製該魔法專屬的 512x512 主視覺
                const baseW = frameW * 0.90 * scaleX;
                const baseH = frameH * 0.90 * scaleY;
                const drawX = cx - baseW * 0.5;
                const drawY = cy - baseH * 0.52 + offsetY;
                sCtx.drawImage(cleanVfx, drawX, drawY, baseW, baseH);

                // 3. 針對每一種魔法疊加專屬的逐幀動態特效 (32種範圍/增益/單體魔法各自獨立動態)
                if (spellStyle === 'heal_light') {
                    // 初級治癒術：翠綠單環十字星芒緩緩上升
                    for (let p = 0; p < 6; p++) {
                        const a = (f * 0.35) + (p * 1.05);
                        const px = cx + Math.cos(a) * (46 * scaleX);
                        const py = ringY - ((f * 15 + p * 31) % 180);
                        sCtx.strokeStyle = (p % 2 === 0) ? '#ffffff' : '#66ffbb';
                        sCtx.lineWidth = 1.8;
                        sCtx.beginPath();
                        sCtx.moveTo(px - 4, py); sCtx.lineTo(px + 4, py);
                        sCtx.moveTo(px, py - 4); sCtx.lineTo(px, py + 4);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'extra_heal') {
                    // 中級治癒術：碧藍雙層水平波紋光環上升 + 水晶十字
                    for (let r = 0; r < 2; r++) {
                        const ryPos = ringY - ((f * 18 + r * 85) % 185);
                        sCtx.strokeStyle = r === 0 ? 'rgba(100, 255, 240, 0.85)' : 'rgba(220, 255, 255, 0.85)';
                        sCtx.lineWidth = 2.4;
                        sCtx.beginPath();
                        sCtx.ellipse(cx, ryPos, 68 * scaleX, 24 * scaleY, 0, 0, Math.PI * 2);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'greater_heal') {
                    // 高級治癒術：熾天使黃金三環聖柱 + 放射聖光束
                    for (let ray = 0; ray < 6; ray++) {
                        const ang = phase * 0.4 + (ray * Math.PI) / 3;
                        sCtx.strokeStyle = 'rgba(255, 240, 140, 0.82)';
                        sCtx.lineWidth = 2.6;
                        sCtx.beginPath();
                        sCtx.moveTo(cx, cy - 25);
                        sCtx.lineTo(cx + Math.cos(ang) * 95 * scaleX, cy - 25 + Math.sin(ang) * 75 * scaleY);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'shield') {
                    // 保護罩：黃金六角蜂巢防護罩收縮脈衝
                    sCtx.strokeStyle = 'rgba(255, 225, 100, 0.90)';
                    sCtx.lineWidth = 2.6;
                    sCtx.beginPath();
                    for (let k = 0; k <= 6; k++) {
                        const a = phase * 0.25 + (k * Math.PI) / 3;
                        const hx = cx + Math.cos(a) * 76 * scaleX;
                        const hy = cy + Math.sin(a) * 76 * scaleY;
                        if (k === 0) sCtx.moveTo(hx, hy); else sCtx.lineTo(hx, hy);
                    }
                    sCtx.stroke();
                } else if (spellStyle === 'blessed_armor') {
                    // 鎧甲護持：皇室藍鑽八角重甲聖盾環繞旋轉
                    for (let s = 0; s < 4; s++) {
                        const a = phase + (s * Math.PI * 0.5);
                        const sx = cx + Math.cos(a) * 78 * scaleX;
                        const sy = cy + Math.sin(a) * 42 * scaleY;
                        sCtx.strokeStyle = '#99ddff';
                        sCtx.lineWidth = 2.4;
                        sCtx.strokeRect(sx - 9, sy - 12, 18, 24);
                    }
                } else if (spellStyle === 'holy_weapon') {
                    // 神聖武器：白金十字聖芒沿劍身向上綻放
                    const crossY = ringY - 35 - ((f * 16) % 155);
                    sCtx.strokeStyle = '#fff8bb';
                    sCtx.lineWidth = 3.2;
                    sCtx.beginPath();
                    sCtx.moveTo(cx - 38 * scaleX, crossY); sCtx.lineTo(cx + 38 * scaleX, crossY);
                    sCtx.moveTo(cx, crossY - 38 * scaleY); sCtx.lineTo(cx, crossY + 38 * scaleY);
                    sCtx.stroke();
                } else if (spellStyle === 'bless_weapon') {
                    // 擬似魔法武器：寶藍與黃金雙色雷電沿聖劍交錯竄動
                    sCtx.strokeStyle = (f % 2 === 0) ? '#ffee88' : '#77ddff';
                    sCtx.lineWidth = 2.2;
                    sCtx.beginPath();
                    for (let seg = 0; seg < 6; seg++) {
                        const ly = ringY - 15 - seg * 32;
                        const lx = cx + ((seg % 2 === 0 ? 1 : -1) * (12 + ((f * 7 + seg * 5) % 16)));
                        if (seg === 0) sCtx.moveTo(cx, ringY - 10);
                        else sCtx.lineTo(lx, ly);
                    }
                    sCtx.stroke();
                } else if (spellStyle === 'bless_magic_weapon') {
                    // 祝福魔法武器：三聖劍環繞光輪 + 紫金大天使雷芒
                    for (let b = -1; b <= 1; b += 2) {
                        const bx = cx + Math.cos(phase + (b > 0 ? 0 : Math.PI)) * 68 * scaleX;
                        sCtx.strokeStyle = '#ffee99';
                        sCtx.lineWidth = 3.0;
                        sCtx.beginPath();
                        sCtx.moveTo(bx, cy - 55 * scaleY);
                        sCtx.lineTo(bx, cy + 45 * scaleY);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'str_up') {
                    // 力量提升：琥珀橘紅雙箭頭向上衝擊波
                    for (let c = 0; c < 3; c++) {
                        const yChev = ringY - ((f * 19 + c * 55) % 175);
                        sCtx.strokeStyle = (c % 2 === 0) ? '#ffaa33' : '#ffee99';
                        sCtx.lineWidth = 3.0;
                        sCtx.beginPath();
                        sCtx.moveTo(cx - 34 * scaleX, yChev + 16);
                        sCtx.lineTo(cx, yChev - 12);
                        sCtx.lineTo(cx + 34 * scaleX, yChev + 16);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'physical_enchant_str') {
                    // 體魄強健術：四道紅寶石泰坦火柱沖天而起
                    for (let col = -1.5; col <= 1.5; col += 1) {
                        const px = cx + col * 36 * scaleX;
                        const pyTop = cy - 75 * scaleY - Math.sin(phase + col) * 18;
                        sCtx.strokeStyle = 'rgba(255, 190, 80, 0.88)';
                        sCtx.lineWidth = 3.5;
                        sCtx.beginPath();
                        sCtx.moveTo(px, ringY);
                        sCtx.lineTo(px, pyTop);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'dex_up') {
                    // 敏捷提升：翠綠雙翼風靈弧線高速旋繞
                    for (let w = 0; w < 2; w++) {
                        const startA = phase * 1.5 + w * Math.PI;
                        sCtx.strokeStyle = '#66ffcc';
                        sCtx.lineWidth = 2.8;
                        sCtx.beginPath();
                        sCtx.arc(cx, cy, 66 * scaleX, startA, startA + 1.8);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'physical_enchant_dex') {
                    // 通暢氣脈術：八脈翡翠風輪高速自轉
                    sCtx.save();
                    sCtx.translate(cx, cy);
                    sCtx.rotate(phase);
                    sCtx.strokeStyle = '#77ffdd';
                    sCtx.lineWidth = 2.2;
                    for (let sp = 0; sp < 8; sp++) {
                        const a = (sp * Math.PI) / 4;
                        sCtx.beginPath();
                        sCtx.moveTo(0, 0);
                        sCtx.lineTo(Math.cos(a) * 82 * scaleX, Math.sin(a) * 82 * scaleY);
                        sCtx.stroke();
                    }
                    sCtx.restore();
                } else if (spellStyle === 'meditation') {
                    // 冥想術：湛藍星辰蓮華展開與靜謐魔力光珠浮升
                    for (let m = 0; m < 8; m++) {
                        const a = -phase + (m * Math.PI * 0.25);
                        const mx = cx + Math.cos(a) * 58 * scaleX;
                        const my = ringY - ((f * 12 + m * 24) % 170);
                        sCtx.fillStyle = (m % 2 === 0) ? '#99eeff' : '#ffffff';
                        sCtx.beginPath();
                        sCtx.arc(mx, my, 3.2, 0, Math.PI * 2);
                        sCtx.fill();
                    }
                } else if (spellStyle === 'haste') {
                    // 加速術：翠綠音速殘影光圈向上連續擴散
                    for (let h = 0; h < 3; h++) {
                        const hy = ringY - ((f * 20 + h * 60) % 180);
                        sCtx.strokeStyle = 'rgba(80, 255, 160, 0.85)';
                        sCtx.lineWidth = 2.4;
                        sCtx.beginPath();
                        sCtx.ellipse(cx, hy, (52 + h * 12) * scaleX, 18 * scaleY, 0, 0, Math.PI * 2);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'greater_haste') {
                    // 強力加速術：翠綠與黃金雷霆雙螺旋極速風暴
                    sCtx.strokeStyle = (f % 2 === 0) ? '#55ffbb' : '#ffee66';
                    sCtx.lineWidth = 3.0;
                    for (let strand = 0; strand < 2; strand++) {
                        sCtx.beginPath();
                        for (let yStep = 0; yStep <= 180; yStep += 15) {
                            const hx = cx + Math.sin(phase * 2 + yStep * 0.06 + strand * Math.PI) * 54 * scaleX;
                            const hy = ringY - yStep;
                            if (yStep === 0) sCtx.moveTo(hx, hy); else sCtx.lineTo(hx, hy);
                        }
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'berserkers') {
                    // 狂暴術：鮮紅狂戰士血氣怒濤與炸裂電芒
                    for (let b = 0; b < 8; b++) {
                        const a = phase + (b * Math.PI * 0.25);
                        sCtx.strokeStyle = (b % 2 === 0) ? '#ff2233' : '#ffbb44';
                        sCtx.lineWidth = 2.8;
                        sCtx.beginPath();
                        sCtx.moveTo(cx + Math.cos(a) * 24, cy + Math.sin(a) * 24);
                        sCtx.lineTo(cx + Math.cos(a) * 88 * scaleX, cy + Math.sin(a) * 88 * scaleY);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'advance_spirit') {
                    // 靈魂昇華：紅(HP)與藍(MP)雙魂螺旋交織昇華至黃金聖冠
                    for (let yStep = 0; yStep <= 170; yStep += 14) {
                        const xHp = cx + Math.cos(phase * 1.5 + yStep * 0.05) * 48 * scaleX;
                        const xMp = cx + Math.cos(phase * 1.5 + yStep * 0.05 + Math.PI) * 48 * scaleX;
                        const py = ringY - yStep;
                        sCtx.fillStyle = '#ff4466';
                        sCtx.fillRect(xHp - 3, py - 3, 6, 6);
                        sCtx.fillStyle = '#44bbff';
                        sCtx.fillRect(xMp - 3, py - 3, 6, 6);
                    }
                } else if (spellStyle === 'invisibility') {
                    // 隱身術：幻影銀藍星霧波紋與半透明殘影收斂
                    sCtx.strokeStyle = 'rgba(180, 235, 255, 0.80)';
                    sCtx.lineWidth = 2.0;
                    sCtx.setLineDash([6, 5]);
                    sCtx.beginPath();
                    sCtx.arc(cx, cy, (45 + (f % 4) * 12) * scaleX, 0, Math.PI * 2);
                    sCtx.stroke();
                    sCtx.setLineDash([]);
                } else if (spellStyle === 'lightning_bolt') {
                    // 極道落雷：天頂垂直劈落的高壓藍白分岔雷霆
                    for (let bolt = -1; bolt <= 1; bolt++) {
                        sCtx.strokeStyle = bolt === 0 ? '#ffffff' : '#66ddff';
                        sCtx.lineWidth = bolt === 0 ? 3.6 : 2.0;
                        sCtx.beginPath();
                        for (let seg = 0; seg < 7; seg++) {
                            const ly = 15 + seg * 34;
                            const lx = cx + bolt * 18 + ((seg % 2 === 0 ? 1 : -1) * (8 + ((f * 9 + seg * 7) % 18)));
                            if (seg === 0) sCtx.moveTo(cx + bolt * 12, 10);
                            else sCtx.lineTo(lx, ly);
                        }
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'sunburst') {
                    // 聖光：十二道璀璨黃金十字太陽神芒放射爆發
                    for (let r = 0; r < 12; r++) {
                        const a = phase * 0.3 + (r * Math.PI * 2) / 12;
                        const len = ((r % 2 === 0) ? 94 : 62) * scaleX;
                        sCtx.strokeStyle = (r % 2 === 0) ? '#ffffff' : '#ffee66';
                        sCtx.lineWidth = (r % 2 === 0) ? 3.0 : 2.0;
                        sCtx.beginPath();
                        sCtx.moveTo(cx, cy);
                        sCtx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'cone_of_cold') {
                    // 冰錐：巨型極寒冰晶尖錐刺穿地面與飛散冰屑
                    for (let k = -2; k <= 2; k++) {
                        const ix = cx + k * 24 * scaleX;
                        const topY = cy - (78 - Math.abs(k) * 16) * scaleY;
                        sCtx.strokeStyle = '#ccf8ff';
                        sCtx.lineWidth = 3.0;
                        sCtx.beginPath();
                        sCtx.moveTo(ix - 8, ringY);
                        sCtx.lineTo(ix, topY);
                        sCtx.lineTo(ix + 8, ringY);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'ice_breath') {
                    // 寒冰氣息：扇形翻湧的極寒冰霧漩渦與雪花
                    for (let p = 0; p < 9; p++) {
                        const px = cx - 75 + ((f * 22 + p * 23) % 165);
                        const py = cy - 45 + Math.sin(phase + p) * 42;
                        sCtx.strokeStyle = '#bff8ff';
                        sCtx.lineWidth = 2.0;
                        sCtx.beginPath();
                        sCtx.arc(px, py, 6 + (p % 3) * 3, 0, Math.PI * 1.5);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'arctic_chill') {
                    // 絕冬凍氣：十二道極寒冰刺自地面向四面八方炸裂放射
                    for (let k = 0; k < 12; k++) {
                        const a = (k * Math.PI * 2) / 12;
                        const rOut = (55 + (f * 5) % 45) * scaleX;
                        sCtx.strokeStyle = (k % 2 === 0) ? '#ffffff' : '#55ddff';
                        sCtx.lineWidth = 2.8;
                        sCtx.beginPath();
                        sCtx.moveTo(cx + Math.cos(a) * 18, ringY - 12 + Math.sin(a) * 10);
                        sCtx.lineTo(cx + Math.cos(a) * rOut, ringY - 24 + Math.sin(a) * (rOut * 0.55));
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'blizzard') {
                    // 冰雪暴：狂暴傾斜席捲的暴風雪冰晶雨
                    for (let p = 0; p < 10; p++) {
                        const sx = cx - 70 + ((p * 29 + f * 17) % 150);
                        const sy = 25 + ((f * 24 + p * 23) % 210);
                        sCtx.strokeStyle = '#dffbff';
                        sCtx.lineWidth = 2.2;
                        sCtx.beginPath();
                        sCtx.moveTo(sx + 10, sy - 14);
                        sCtx.lineTo(sx - 10, sy + 14);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'ice_lance_wall') {
                    // 冰矛圍籬：七座垂直冰晶長矛柵欄與冰封鎖鏈
                    sCtx.strokeStyle = '#99f0ff';
                    sCtx.lineWidth = 2.5;
                    for (let k = -3; k <= 3; k++) {
                        const lx = cx + k * 24 * scaleX;
                        sCtx.beginPath();
                        sCtx.moveTo(lx, ringY);
                        sCtx.lineTo(lx, cy - 60 * scaleY);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'eruption') {
                    // 地裂術：地面鋸齒狀熔岩裂縫與飛濺岩塊
                    sCtx.strokeStyle = '#ffaa33';
                    sCtx.lineWidth = 3.2;
                    for (let c = -1; c <= 1; c++) {
                        sCtx.beginPath();
                        sCtx.moveTo(cx, ringY);
                        sCtx.lineTo(cx + c * 38 * scaleX, cy - 20);
                        sCtx.lineTo(cx + c * 62 * scaleX, cy - 75 * scaleY);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'seismic_strike') {
                    // 震裂術：紫金重力崩裂同心圓震波與浮空碎石
                    for (let w = 0; w < 3; w++) {
                        const rad = ((f * 14 + w * 32) % 95) * scaleX;
                        sCtx.strokeStyle = (w % 2 === 0) ? '#e088ff' : '#ffdd77';
                        sCtx.lineWidth = 2.6;
                        sCtx.beginPath();
                        sCtx.ellipse(cx, cy + 15, rad, rad * 0.55, 0, 0, Math.PI * 2);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'fireball_spell') {
                    // 燃燒的火球：中心熾白太陽火核向外炸裂圓形衝擊環
                    const blastR = (28 + f * 6.5) * scaleX;
                    sCtx.strokeStyle = 'rgba(255, 220, 90, 0.90)';
                    sCtx.lineWidth = 3.5;
                    sCtx.beginPath();
                    sCtx.arc(cx, cy, blastR, 0, Math.PI * 2);
                    sCtx.stroke();
                } else if (spellStyle === 'fire_cone') {
                    // 火焰噴射：扇形向外奔騰的五道龍焰火舌
                    for (let ray = -2; ray <= 2; ray++) {
                        const a = ray * 0.22;
                        sCtx.strokeStyle = (ray % 2 === 0) ? '#ffee77' : '#ff5500';
                        sCtx.lineWidth = 3.4;
                        sCtx.beginPath();
                        sCtx.moveTo(cx - 55 * scaleX, cy);
                        sCtx.lineTo(cx + Math.cos(a) * 85 * scaleX, cy + Math.sin(a) * 85 * scaleY);
                        sCtx.stroke();
                    }
                } else if (spellStyle === 'vampiric_touch') {
                    // 吸血鬼之吻：腥紅血蝠能量光球向中心旋轉收攏汲取
                    for (let p = 0; p < 7; p++) {
                        const a = phase + (p * Math.PI * 2) / 7;
                        const dist = (88 - (f * 6) % 72) * scaleX;
                        const px = cx + Math.cos(a) * dist;
                        const py = cy + Math.sin(a) * dist * 0.75;
                        sCtx.fillStyle = (p % 2 === 0) ? '#ff2266' : '#ff99cc';
                        sCtx.beginPath();
                        sCtx.arc(px, py, 3.8, 0, Math.PI * 2);
                        sCtx.fill();
                    }
                } else if (spellStyle === 'mana_drain') {
                    // 魔力奪取：深淵紫藍奧術漩渦向中心抽取魔力星珠
                    sCtx.strokeStyle = '#77ddff';
                    sCtx.lineWidth = 2.2;
                    for (let s = 0; s < 4; s++) {
                        const startA = -phase * 1.4 + s * Math.PI * 0.5;
                        sCtx.beginPath();
                        sCtx.arc(cx, cy, (75 - (f * 4) % 50) * scaleX, startA, startA + 1.2);
                        sCtx.stroke();
                    }
                } else {
                    // 火風暴 (fire_storm)：旋轉上升的烈焰龍捲火舌與爆裂火星
                    for (let p = 0; p < 9; p++) {
                        const a = (f * 0.55) + (p * Math.PI * 0.25);
                        const rad = (28 + (p % 3) * 26) * scaleX;
                        const px = cx + Math.cos(a) * rad;
                        const py = ringY - ((f * 18 + p * 27) % 185);
                        sCtx.fillStyle = (p % 2 === 0) ? '#fff3a8' : '#ff5500';
                        sCtx.beginPath();
                        sCtx.arc(px, py, 3.2, 0, Math.PI * 2);
                        sCtx.fill();
                    }
                }

                sCtx.restore();
            }

            if (scene.textures.exists(texKey)) scene.textures.remove(texKey);
            scene.textures.addSpriteSheet(texKey, sheet, { frameWidth: frameW, frameHeight: frameH });
            return true;
        }

        // 使用 34 種魔法各自專屬的圖資產生《天堂1》暗黑金框魔法書圖示
        function buildLineageSpellIcons(scene) {
            for (let spellId in MagicDict) {
                const spell = MagicDict[spellId];
                const key = spell.icon;
                const c = document.createElement('canvas');
                c.width = 40;
                c.height = 40;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#090b10';
                ctx.fillRect(0, 0, 40, 40);

                const img = getAssetImage(spell.rawIcon, key, scene);
                if (img && img.width) {
                    ctx.drawImage(img, 2, 2, 36, 36);
                } else {
                    ctx.fillStyle = spell.borderColor || '#55aaff';
                    ctx.fillRect(4, 4, 32, 32);
                }

                // 天堂1古銅金立體雙層外框 + 元素屬性內框
                ctx.strokeStyle = spell.borderColor || '#55aaff';
                ctx.lineWidth = 1.6;
                ctx.strokeRect(2.5, 2.5, 35, 35);
                ctx.strokeStyle = '#d8b458';
                ctx.lineWidth = 2;
                ctx.strokeRect(1, 1, 38, 38);

                // 右上角魔法階位羅馬數字徽章 (I ~ VIII)
                if (spell.badge) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
                    ctx.fillRect(21, 2, 17, 12);
                    ctx.font = 'bold 9px monospace';
                    ctx.fillStyle = '#ffee88';
                    ctx.textAlign = 'center';
                    ctx.fillText(spell.badge, 29.5, 11);
                }

                if (scene.textures.exists(key)) scene.textures.remove(key);
                scene.textures.addImage(key, c);
            }
        }

        // 製作出生點【大魔法師 ‧ 吉倫】專屬 4 幀動態懸浮與奧術光環 NPC 序列圖
        function buildLineageWizardNpcSheet(scene) {
            const fw = 128;
            const fh = 144;
            const frames = 4;
            const sheet = document.createElement('canvas');
            sheet.width = fw * frames;
            sheet.height = fh;
            const ctx = sheet.getContext('2d');

            const rawImg = getAssetImage('char_mage_raw.jpg', 'mage', scene);
            const cleanMage = rawImg ? extractLineageSubjectCanvas(rawImg, 280, false) : null;

            for (let f = 0; f < frames; f++) {
                const ox = f * fw;
                const cx = ox + fw * 0.5;
                const phase = (f / frames) * Math.PI * 2;
                const floatY = Math.sin(phase) * 3.5;

                ctx.save();
                ctx.beginPath();
                ctx.rect(ox, 0, fw, fh);
                ctx.clip();

                // 1. 腳底黃金奧術六芒星陣
                const ringY = fh - 18;
                ctx.save();
                ctx.translate(cx, ringY);
                ctx.fillStyle = 'rgba(10, 25, 55, 0.55)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 44, 18, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffdd66';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.ellipse(0, 0, 42, 16, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.strokeStyle = '#55ddff';
                ctx.lineWidth = 1.4;
                for (let k = 0; k < 6; k++) {
                    const a1 = phase * 0.5 + (k * Math.PI) / 3;
                    const a2 = phase * 0.5 + (((k + 2) % 6) * Math.PI) / 3;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a1) * 34, Math.sin(a1) * 13);
                    ctx.lineTo(Math.cos(a2) * 34, Math.sin(a2) * 13);
                    ctx.stroke();
                }
                ctx.restore();

                // 2. 繪製大魔法師本體 (搭配神聖紫金光暈)
                if (cleanMage) {
                    const fitScale = Math.min((fw * 0.72) / cleanMage.width, (fh * 0.76) / cleanMage.height);
                    const dw = Math.round(cleanMage.width * fitScale);
                    const dh = Math.round(cleanMage.height * fitScale);
                    const dx = Math.round(cx - dw * 0.5);
                    const dy = Math.round(fh - dh - 14 + floatY);

                    ctx.save();
                    ctx.shadowColor = '#66ccff';
                    ctx.shadowBlur = 10;
                    ctx.drawImage(cleanMage, dx, dy, dw, dh);
                    ctx.restore();
                } else {
                    // 備用繪製大魔法師長袍與法杖
                    ctx.fillStyle = '#223377';
                    ctx.beginPath();
                    ctx.moveTo(cx, 34 + floatY);
                    ctx.lineTo(cx - 28, fh - 16);
                    ctx.lineTo(cx + 28, fh - 16);
                    ctx.closePath();
                    ctx.fill();
                }

                // 3. 環繞大魔法師的三顆懸浮奧術法球與聖冠光輝
                for (let orb = 0; orb < 3; orb++) {
                    const oa = phase + (orb * Math.PI * 2) / 3;
                    const oxPos = cx + Math.cos(oa) * 38;
                    const oyPos = fh * 0.48 + Math.sin(oa) * 14 + floatY;
                    const grad = ctx.createRadialGradient(oxPos, oyPos, 1, oxPos, oyPos, 9);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.5, orb === 0 ? '#ffee66' : (orb === 1 ? '#55ddff' : '#cc77ff'));
                    grad.addColorStop(1, 'rgba(0, 180, 255, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(oxPos, oyPos, 9, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            if (scene.textures.exists('npc_wizard')) scene.textures.remove('npc_wizard');
            scene.textures.addSpriteSheet('npc_wizard', sheet, { frameWidth: fw, frameHeight: fh });
            return true;

        function getItemTooltipText(id, isSelling = false) {
            let item = ItemDict[id];

            let text = item.name;

            else if (pendingEnchantScrollIndex !== -1) {
                if ((pendingEnchantType === 'weapon' && item.type === 'weapon') || 
                    (pendingEnchantType === 'armor' && item.type === 'armor')) {
                    text += " (點擊進行強化)";
                } else { text += " (無法強化此物品)"; }
            }
            if (item.type === 'weapon') {
                text += `\n攻擊力: ${item.minDmg} ~ ${item.maxDmg}`;
                if (item.strBonus) text += ` | 力量 +${item.strBonus}`;
                text += `\n武器類型: ${item.weaponType === 'melee' ? '近戰' : (item.weaponType === 'ranged' ? '遠程' : '魔法')}`;
                text += `\n安定值: ${item.safeEnchant}`;
            } else if (item.type === 'armor') {
                text += `\n防禦力 (DEF): ${item.def}`;
                if (item.mr > 0) text += ` | 抗魔 (MR): ${item.mr}`;
                if (item.strBonus) text += ` | 力量 +${item.strBonus}`;
                text += `\n安定值: ${item.safeEnchant}`;

            return text;

        // 將 Imagen 3.0 生成的《天堂1》材質進行即時無縫拼接與精準去背
        function prepareLineageMapTextures(scene) {
            function makeSeamlessTile(srcImg, targetKey, size, sx, sy, sw, sh) {
                try {
                    if (!srcImg || !srcImg.width) return false;

                    const workCanvas = document.createElement('canvas');
                    workCanvas.width = size;
                    workCanvas.height = size;
                    const wCtx = workCanvas.getContext('2d', { willReadFrequently: true });
                    if (sw && sh) {
                        wCtx.drawImage(srcImg, sx, sy, sw, sh, 0, 0, size, size);
                    } else {
                        wCtx.drawImage(srcImg, 0, 0, size, size);
                    }

                    const srcData = wCtx.getImageData(0, 0, size, size).data;
                    const outCanvas = document.createElement('canvas');
                    outCanvas.width = size;
                    outCanvas.height = size;
                    const oCtx = outCanvas.getContext('2d');
                    const outImgData = oCtx.createImageData(size, size);
                    const dst = outImgData.data;

                    const half = size >> 1;
                    const weights = new Float32Array(size);
                    for (let i = 0; i < size; i++) {
                        weights[i] = 0.5 * (1.0 - Math.cos((2.0 * Math.PI * i) / size));
                    }

                    for (let y = 0; y < size; y++) {
                        const wy = weights[y];
                        const y2 = (y + half) % size;
                        for (let x = 0; x < size; x++) {
                            const wx = weights[x];
                            const x2 = (x + half) % size;

                            const i00 = (y * size + x) * 4;
                            const i10 = (y * size + x2) * 4;
                            const i01 = (y2 * size + x) * 4;
                            const i11 = (y2 * size + x2) * 4;

                            const w00 = wx * wy;
                            const w10 = (1.0 - wx) * wy;
                            const w01 = wx * (1.0 - wy);
                            const w11 = (1.0 - wx) * (1.0 - wy);

                            dst[i00]     = (w00 * srcData[i00]     + w10 * srcData[i10]     + w01 * srcData[i01]     + w11 * srcData[i11]) | 0;
                            dst[i00 + 1] = (w00 * srcData[i00 + 1] + w10 * srcData[i10 + 1] + w01 * srcData[i01 + 1] + w11 * srcData[i11 + 1]) | 0;
                            dst[i00 + 2] = (w00 * srcData[i00 + 2] + w10 * srcData[i10 + 2] + w01 * srcData[i01 + 2] + w11 * srcData[i11 + 2]) | 0;
                            dst[i00 + 3] = 255;
                        }
                    }
                    oCtx.putImageData(outImgData, 0, 0);
                    if (scene.textures.exists(targetKey)) scene.textures.remove(targetKey);
                    scene.textures.addCanvas(targetKey, outCanvas);
                    return true;
                } catch (e) {
                    console.warn("Seamless tile failed:", targetKey, e);
                    return false;
                }
            }

            function extractCleanSprite(srcImg, targetKey, maxDim) {
                try {
                    if (!srcImg || !srcImg.width) return false;

                    const workSize = 360;
                    const workCanvas = document.createElement('canvas');
                    workCanvas.width = workSize;
                    workCanvas.height = workSize;
                    const wCtx = workCanvas.getContext('2d', { willReadFrequently: true });
                    wCtx.drawImage(srcImg, 0, 0, workSize, workSize);

                    const imgData = wCtx.getImageData(0, 0, workSize, workSize);
                    const d = imgData.data;
                    const total = workSize * workSize;
                    const isBg = new Uint8Array(total);
                    const queue = new Int32Array(total);
                    let qHead = 0, qTail = 0;

                    function isWhitePixel(idx) {
                        const p = idx * 4;
                        const r = d[p], g = d[p + 1], b = d[p + 2];
                        const max = r > g ? (r > b ? r : b) : (g > b ? g : b);
                        const min = r < g ? (r < b ? r : b) : (g < b ? g : b);
                        const sat = max - min;
                        const lum = (r + g + b) / 3;
                        return (lum >= 222 && sat <= 20) || (lum >= 238 && sat <= 30);
                    }

                    for (let x = 0; x < workSize; x++) {
                        const top = x;
                        const bot = (workSize - 1) * workSize + x;
                        if (isWhitePixel(top)) { isBg[top] = 1; queue[qTail++] = top; }
                        if (isWhitePixel(bot)) { isBg[bot] = 1; queue[qTail++] = bot; }
                    }
                    for (let y = 0; y < workSize; y++) {
                        const left = y * workSize;
                        const right = y * workSize + (workSize - 1);
                        if (!isBg[left] && isWhitePixel(left)) { isBg[left] = 1; queue[qTail++] = left; }
                        if (!isBg[right] && isWhitePixel(right)) { isBg[right] = 1; queue[qTail++] = right; }
                    }

                    // 偵測樹枝間隙與拱門內部的純白區塊 (3x3 純白無色偏)
                    for (let y = 2; y < workSize - 2; y++) {
                        for (let x = 2; x < workSize - 2; x++) {
                            const idx = y * workSize + x;
                            if (isBg[idx]) continue;
                            let allPure = true;
                            for (let dy = -1; dy <= 1 && allPure; dy++) {
                                for (let dx = -1; dx <= 1 && allPure; dx++) {
                                    const p = ((y + dy) * workSize + (x + dx)) * 4;
                                    const r = d[p], g = d[p + 1], b = d[p + 2];
                                    const max = r > g ? (r > b ? r : b) : (g > b ? g : b);
                                    const min = r < g ? (r < b ? r : b) : (g < b ? g : b);
                                    if (r < 245 || g < 245 || b < 245 || (max - min) > 7) allPure = false;
                                }
                            }
                            if (allPure) {
                                isBg[idx] = 1;
                                queue[qTail++] = idx;
                            }
                        }
                    }

                    const dxArr = [-1, 1, 0, 0, -1, -1, 1, 1];
                    const dyArr = [0, 0, -1, 1, -1, 1, -1, 1];
                    while (qHead < qTail) {
                        const cur = queue[qHead++];
                        const cx = cur % workSize;
                        const cy = (cur / workSize) | 0;
                        for (let dir = 0; dir < 8; dir++) {
                            const nx = cx + dxArr[dir];
                            const ny = cy + dyArr[dir];
                            if (nx >= 0 && nx < workSize && ny >= 0 && ny < workSize) {
                                const nIdx = ny * workSize + nx;
                                if (!isBg[nIdx] && isWhitePixel(nIdx)) {
                                    isBg[nIdx] = 1;
                                    queue[qTail++] = nIdx;
                                }
                            }
                        }
                    }

                    let minX = workSize, minY = workSize, maxX = 0, maxY = 0;
                    for (let y = 0; y < workSize; y++) {
                        for (let x = 0; x < workSize; x++) {
                            const idx = y * workSize + x;
                            const p = idx * 4;
                            if (isBg[idx]) {
                                d[p + 3] = 0;
                            } else {
                                let bgNeighbors = 0;
                                for (let dir = 0; dir < 8; dir++) {
                                    const nx = x + dxArr[dir];
                                    const ny = y + dyArr[dir];
                                    if (nx < 0 || nx >= workSize || ny < 0 || ny >= workSize || isBg[ny * workSize + nx]) {
                                        bgNeighbors++;
                                    }
                                }
                                let alpha = 255;
                                let r = d[p], g = d[p + 1], b = d[p + 2];
                                if (bgNeighbors > 0) {
                                    const lum = (r + g + b) / 3;
                                    if (lum > 165) {
                                        alpha = Math.max(0, 255 - ((lum - 145) * 3) | 0);
                                        r = (r * 0.62) | 0;
                                        g = (g * 0.62) | 0;
                                        b = (b * 0.62) | 0;
                                    }
                                }
                                if (alpha > 12) {
                                    if (x < minX) minX = x;
                                    if (x > maxX) maxX = x;
                                    if (y < minY) minY = y;
                                    if (y > maxY) maxY = y;
                                    d[p] = r; d[p + 1] = g; d[p + 2] = b; d[p + 3] = alpha;
                                } else {
                                    d[p + 3] = 0;
                                }
                            }
                        }
                    }
                    wCtx.putImageData(imgData, 0, 0);

                    const cropW = Math.max(1, maxX - minX + 1);
                    const cropH = Math.max(1, maxY - minY + 1);
                    const scale = Math.min(maxDim / cropW, maxDim / cropH);
                    const outW = Math.max(1, Math.round(cropW * scale));
                    const outH = Math.max(1, Math.round(cropH * scale));

                    const outCanvas = document.createElement('canvas');
                    outCanvas.width = outW;
                    outCanvas.height = outH;
                    const oCtx = outCanvas.getContext('2d');
                    oCtx.drawImage(workCanvas, minX, minY, cropW, cropH, 0, 0, outW, outH);

            makeSeamlessTile(getAssetImage('map_grass.jpg', 'raw_map_grass', scene), 'lineage_grass', 256, 0, 0, 0, 0);

        // 建立《天堂1》(Lineage 1) 風格 3x3 九倍大世界地圖 (18000 x 18000，中央出生點 9000, 9000)

        function getLineageRegionName(x, y) {
            if (Math.abs(x - TOWN_CENTER_X) <= 440 && Math.abs(y - TOWN_CENTER_Y) <= 440) return '說話之島村莊 (安全廣場)';
            if (y < 6000) {
                if (x < 6000) return '西北 ‧ 眠龍洞穴森林 ( ঘুম Dragon Woods)';
                if (x > 12000) return '東北 ‧ 歐瑞雪域邊境 (Oren Frontier)';
                return '北方 ‧ 妖精森林 (Elven Forest)';
            }
            if (y > 12000) {
                if (x < 6000) return '西南 ‧ 風木荒漠領地 (Windawood Wastes)';
                if (x > 12000) return '東南 ‧ 亞丁王都邊境 (Aden Border)';
                return '南方 ‧ 龍之谷荒野 (Dragon Valley)';
            }
            if (x < 6000) return '西方 ‧ 古魯丁平原 (Gludio Plains)';
            if (x > 12000) return '東方 ‧ 奇岩邊境森林 (Giran Woods)';
            if (Math.abs(x - TOWN_CENTER_X) < 110 || Math.abs(y - TOWN_CENTER_Y) < 110) return '亞丁王國十字古道';
            return '說話之島中央狩獵場';
        }

        // 安全建立動畫輔助函式，確保圖片幀數完整才註冊動畫，徹底防止攻擊或移動時當機
        function createSafeAnim(scene, animKey, texKey, startFrame, endFrame, frameRate, repeat) {
            try {
                if (scene.anims.exists(animKey)) scene.anims.remove(animKey);
                if (!scene.textures.exists(texKey)) return false;
                const tex = scene.textures.get(texKey);
                if (!tex || tex.key === '__MISSING' || tex.frameTotal <= 1) return false;
                const maxIdx = Math.max(0, tex.frameTotal - 2);
                const actualStart = Math.min(startFrame, maxIdx);
                const actualEnd = Math.min(endFrame, maxIdx);
                const frames = scene.anims.generateFrameNumbers(texKey, { start: actualStart, end: actualEnd });
                if (frames && frames.length > 0) {
                    scene.anims.create({ key: animKey, frames: frames, frameRate: frameRate, repeat: repeat });
                    return true;
                }
            } catch (e) {
                console.warn('Animation creation skipped:', animKey, e);
            }
            return false;
        }
