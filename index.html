            uiGraphics = this.add.graphics().setDepth(9999); 
            topTextUI = this.add.text(20, 20, '', { fontSize: '18px', fill: '#ffffff', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setScrollFactor(0).setDepth(9999);
            regionTextUI = this.add.text(20, 46, '', { fontSize: '14px', fill: '#e8d8a8', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setScrollFactor(0).setDepth(9999);
            itemTooltip = this.add.text(0, 0, '', { fontSize: '14px', fill: '#ffffaa', fontStyle: 'bold', backgroundColor: 'rgba(0,0,0,0.85)', padding: {x: 8, y: 5}, border: '1px solid #777' }).setScrollFactor(0).setDepth(30000).setVisible(false);

            createInventoryUI(this); 
            createStatsUI(this); 
            createShopUI(this); 
            createMagicUI(this); 
            createWizardShopUI(this);

            // 非同步分批註冊與合成所有遊戲圖資，同步更新視覺化載入進度條 (Preloader)
            registerPreloadedAssetsAsync(this, () => {
                try {
                    createSafeAnim(this, 'fireball-fly', 'fireball', 0, 7, 18, -1);
                    createSafeAnim(this, 'arrow-fly', 'arrow', 0, 7, 20, -1);
                    createSafeAnim(this, 'play_magicarrow', 'eff_magicarrow', 0, 7, 20, -1);
                    createSafeAnim(this, 'play_firearrow', 'eff_firearrow', 0, 7, 20, -1);
                    createSafeAnim(this, 'play_windblade', 'eff_windblade', 0, 7, 22, -1);
                    createSafeAnim(this, 'play_ice_dagger', 'eff_ice_dagger', 0, 7, 20, -1);
                    createSafeAnim(this, 'play_fireball_proj', 'eff_fireball_proj', 0, 7, 20, -1);

                    for (let sKey in MagicDict) {
                        let sp = MagicDict[sKey];
                        if (sp.animKey && sp.texKey) {
                            createSafeAnim(this, sp.animKey, sp.texKey, 0, 11, 16, 0);
                        }
                    }

                    ['knight', 'elf', 'mage'].forEach(cls => {
                        createSafeAnim(this, cls + '-walk', cls, 0, 7, 14, -1);
                        createSafeAnim(this, cls + '-attack', cls, 8, 15, 22, 0);
                    });
                    if (typeof MonsterDictionary !== 'undefined') {
                        for (let mKey in MonsterDictionary) {
                            createSafeAnim(this, mKey + '-walk', mKey, 0, 3, 8, -1);
                            createSafeAnim(this, mKey + '-attack', mKey, 4, 7, 14, 0);
                        }
                    }
                } catch (animErr) {
                    console.warn('Animation init warning:', animErr);
                }
                
                // 隱藏載入進度條，進入職業選擇或自動讀檔
                hidePreloaderUI();

                let autoLoad = false;
                try {
                    if (sessionStorage.getItem('autoLoadSave') === 'true') {
                        sessionStorage.removeItem('autoLoadSave');
                        autoLoad = true;
                    }
                } catch (e) {}
                if (autoLoad) {
                    let saveData = getSavedGameData();
                    if (saveData) {
                        startGame(saveData.playerClass, saveData);
                    } else {
                        showClassSelection();
                    }
                } else {
                    showClassSelection();
                }
            });

            this.input.on('dragstart', function (pointer, gameObject) {
                if (gameObject.isSpellDragItem) {
                    itemTooltip.setVisible(false);
                    draggingSpellId = gameObject.spellId;
                    draggingFromHotkeyIndex = (typeof gameObject.hotkeySlotIdx === 'number') ? gameObject.hotkeySlotIdx : -1;
                    if (magicDragGhost) { magicDragGhost.destroy(); magicDragGhost = null; }
                    const sp = MagicDict[draggingSpellId];
                    if (sp && mainScene.textures.exists(sp.icon)) {
                        magicDragGhost = mainScene.add.image(pointer.x, pointer.y, sp.icon)
                            .setScrollFactor(0).setDepth(30005).setScale(1.05).setAlpha(0.92);
                    }
                    return;
                }
                if (!isInventoryOpen || !gameObject.isInvItem) return;
                gameObject.startX = gameObject.x;
                gameObject.startY = gameObject.y;
                itemTooltip.setVisible(false);
            });
            this.input.on('drag', function (pointer, gameObject, dragX, dragY) {
                if (gameObject.isSpellDragItem) {
                    if (magicDragGhost) {
                        magicDragGhost.setPosition(pointer.x, pointer.y);
                    }
                    return;
                }
                if (!isInventoryOpen || !gameObject.isInvItem) return;
                gameObject.x = dragX;
                gameObject.y = dragY;
            });
            this.input.on('dragend', function (pointer, gameObject) {
                if (gameObject.isSpellDragItem) {
                    if (magicDragGhost) {
                        magicDragGhost.destroy();
                        magicDragGhost = null;
                    }
                    if (draggingSpellId && player && player.magicHotkeys) {
                        const targetSlot = getMagicHotkeySlotAtScreenPos(pointer.x, pointer.y);
                        if (targetSlot !== -1) {
                            if (draggingFromHotkeyIndex !== -1 && draggingFromHotkeyIndex !== targetSlot) {
                                const temp = player.magicHotkeys[targetSlot];
                                player.magicHotkeys[targetSlot] = draggingSpellId;
                                player.magicHotkeys[draggingFromHotkeyIndex] = temp;
                            } else {
                                player.magicHotkeys[targetSlot] = draggingSpellId;
                            }
                            currentHotkeyIndex = targetSlot;
                            const spName = MagicDict[draggingSpellId] ? MagicDict[draggingSpellId].name : '';
                            showFloatingText(`熱鍵 ${targetSlot + 1} 設定【${spName}】`, player, '#00ffff');
                            updateMagicHotkeyBarUI();
                            if (isMagicOpen) updateMagicUI();
                            saveGame(true);
                        } else if (draggingFromHotkeyIndex !== -1 && pointer.y < 500) {
                            player.magicHotkeys[draggingFromHotkeyIndex] = null;
                            showFloatingText(`已清除魔法熱鍵 ${draggingFromHotkeyIndex + 1}`, player, '#aaaaaa');
                            updateMagicHotkeyBarUI();
                            saveGame(true);
                        }
                    }
                    draggingSpellId = null;
                    draggingFromHotkeyIndex = -1;
                    return;
                }
                if (!isInventoryOpen || !gameObject.isInvItem) return;
                if (gameObject.isEquipped) { updateInventoryUI(); return; }
                if (gameObject.x < 550 || gameObject.x > 790 || gameObject.y < 80 || gameObject.y > 510) discardItem(gameObject.invIndex); else updateInventoryUI(); 
            });

            this.input.keyboard.on('keydown-I', toggleInventory); 
            this.input.keyboard.on('keydown-C', toggleStats); 
            this.input.keyboard.on('keydown-M', toggleMagic); 
            this.input.keyboard.on('keydown-Q', function () { quickUseItem(potionTypes[currentPotionIndex]); });
            this.input.keyboard.on('keydown-E', function () { performMagicAttack(); });
            // 鍵盤數字鍵 1~8 亦可直接切換對應的魔法熱鍵
            ['ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT'].forEach((kName, idx) => {
                this.input.keyboard.on('keydown-' + kName, function () {
                    if (!isPlaying || !player || player.isDead) return;
                    selectMagicHotkeySlot(idx, true);
                });
            });

            this.input.on('pointerdown', function (pointer, gameObjects) {
                if (pendingEnchantScrollIndex !== -1) { showFloatingText('取消強化', player, '#aaaaaa'); cancelEnchant(); }

                if (!isPlaying || !player) return; 
                if (isInventoryOpen && pointer.x >= 550 && pointer.x <= 790 && pointer.y >= 80 && pointer.y <= 510) return; 
                if (isStatsOpen && pointer.x >= 10 && pointer.x <= 280 && pointer.y >= 80 && pointer.y <= 510) return; 
                if (isShopOpen && pointer.x >= 290 && pointer.x <= 540 && pointer.y >= 80 && pointer.y <= 510) return;
                if (isMagicOpen && pointer.x >= 90 && pointer.x <= 550 && pointer.y >= 65 && pointer.y <= 505) return;
                if (isWizardShopOpen && pointer.x >= 90 && pointer.x <= 550 && pointer.y >= 65 && pointer.y <= 505) return;
                
                // 虛擬搖桿區域與正下方8格魔法熱鍵區防點擊穿透
                if (pointer.x <= 200 && pointer.y >= 400) return;
                if (pointer.x >= 180 && pointer.x <= 500 && pointer.y >= 518) return;
                if (pointer.x >= 505 && pointer.y >= 450) return;

                if (player.isDead) return;
                stopAttacking();
                pendingNpcAction = null;
                
                let clickedObj = null;
                if (gameObjects && gameObjects.length > 0) {
                    for (let i = 0; i < gameObjects.length; i++) {
                        if (gameObjects[i].isWizardNpc || gameObjects[i].isShopBuilding) return;
                        if (gameObjects[i].isMonster && !gameObjects[i].isDead) { clickedObj = gameObjects[i]; break; }
                    }
                }
                
                if (clickedObj) { targetEntity = clickedObj; targetPoint = new Phaser.Math.Vector2(targetEntity.x, targetEntity.y); } 
                else { targetEntity = null; targetPoint = new Phaser.Math.Vector2(pointer.worldX, pointer.worldY); }
                
                mainScene.physics.moveToObject(player, targetPoint, player.speed);
                if (!isAttacking) { safePlayAnim(player, player.playerClass + '-walk'); player.setFlipX(targetPoint.x < player.x); }
            }, this);

            this.time.addEvent({
                delay: 3000,
                callback: function() {
                    if (!isPlaying || !player || player.isDead) return;
                    if (player.hp < player.maxHp) {
                        player.hp = Math.min(player.maxHp, player.hp + Math.max(1, Math.floor(player.con / 3)));
                    }
                    if (player.mp < player.maxMp) {
                        let medBonus = (player.activeBuffs && player.activeBuffs.is_meditating) ? (player.activeBuffs.mp_regen_bonus || 18) : 0;
                        let mpRegen = Math.max(1, Math.floor(player.wis / 3)) + (player.hasBluePotion ? 8 : 0) + medBonus;
                        player.mp = Math.min(player.maxMp, player.mp + mpRegen);
                        if (medBonus > 0) {
                            showFloatingText(`+${mpRegen} MP (冥想)`, player, '#66ddff');
                            spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 44, 0x44ccff, 0x88ffee, 620);
                        }
                    }
                    updateUI();
                },
                loop: true
            });
        }

        // 強制全螢幕與橫向鎖定函式
        function attemptFullscreenAndLandscape() {
            try {
                let docEl = document.documentElement;
                if (docEl.requestFullscreen) { docEl.requestFullscreen().catch(e=>{}); }
                else if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen().catch(e=>{}); } 
                
                if (screen.orientation && screen.orientation.lock) { 
                    screen.orientation.lock('landscape').catch(e=>{}); 
                }
            } catch(e) { console.warn("Fullscreen API not supported or rejected.", e); }
        }

        function safePlayAnim(entity, animKey, forceRestart = false) {
            try {
                if (!entity || !entity.active || !entity.anims || !entity.scene || !entity.scene.anims) return;
                if (!entity.scene.anims.exists(animKey)) return;
                const anim = entity.scene.anims.get(animKey);
                if (!anim || !anim.frames || anim.frames.length === 0) return;
                entity.anims.play(animKey, !forceRestart);
            } catch (e) {
                console.warn("safePlayAnim skipped:", animKey, e);
            }
        }

        // 天堂1風格 60FPS 即時揮砍劍氣與打擊火花特效
        function spawnSlashArcEffect(scene, x, y, angle, playerClass, weaponId) {
            try {
                if (!scene || !scene.add) return;
                const slash = scene.add.graphics().setDepth(y + 180);
                slash.setPosition(x + Math.cos(angle) * 18, y - 8 + Math.sin(angle) * 18);
                slash.setRotation(angle);

                let outerColor = 0xffdd77;
                let innerColor = 0xffffff;
                if (weaponId === 'force_staff' || playerClass === 'mage') {
                    outerColor = 0x55ccff;
                    innerColor = 0xe8ffff;
                } else if (weaponId === 'execution_sword' || weaponId === 'dk_sword') {
                    outerColor = 0xff4422;
                    innerColor = 0xffdd99;
                } else if (weaponId === 'wind_blade_dagger' || playerClass === 'elf') {
                    outerColor = 0x66ffaa;
                    innerColor = 0xe8ffee;
                }

                // 外層劍氣月牙弧光
                slash.lineStyle(9, outerColor, 0.72);
                slash.beginPath();
                slash.arc(0, 0, 38, -1.05, 1.05, false);
                slash.strokePath();

                // 內層高光刀鋒殘影
                slash.lineStyle(4, innerColor, 0.96);
                slash.beginPath();
                slash.arc(4, 0, 38, -0.82, 0.82, false);
                slash.strokePath();

                scene.tweens.add({
                    targets: slash,
                    x: x + Math.cos(angle) * 34,
                    y: y - 8 + Math.sin(angle) * 34,
                    scaleX: 1.28,
                    scaleY: 1.18,
                    alpha: 0,
                    duration: 165,
                    ease: 'Cubic.easeOut',
                    onComplete: () => { if (slash && slash.destroy) slash.destroy(); }
                });
            } catch (e) {}
        }

        function spawnHitSparkEffect(scene, x, y, colorHex = 0xffdd66) {
            try {
                if (!scene || !scene.add) return;
                const spark = scene.add.graphics().setDepth(y + 220);
                spark.setPosition(x, y - 10);
                spark.fillStyle(0xffffff, 0.95);
                spark.fillCircle(0, 0, 7);
                spark.lineStyle(2.5, colorHex, 0.95);
                for (let i = 0; i < 6; i++) {
                    const a = (Math.PI * 2 * i) / 6 + (Math.random() * 0.35);
                    const r1 = 4;
                    const r2 = 16 + Math.random() * 8;
                    spark.beginPath();
                    spark.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
                    spark.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
                    spark.strokePath();
                }
                scene.tweens.add({
                    targets: spark,
                    scaleX: 1.45,
                    scaleY: 1.45,
                    alpha: 0,
                    duration: 180,
                    ease: 'Quad.easeOut',
                    onComplete: () => { if (spark && spark.destroy) spark.destroy(); }
                });
            } catch (e) {}
        }

        // 天堂1風格 妖精弓弦風靈震波 / 法師法杖奧術閃光 / 火箭術龍焰起手特效
        function spawnCastMuzzleEffect(scene, x, y, angle, vfxType) {
            try {
                if (!scene || !scene.add) return;
                const mx = x + Math.cos(angle) * 20;
                const my = y - 6 + Math.sin(angle) * 20;
                const g = scene.add.graphics().setDepth(y + 190);
                g.setPosition(mx, my);
                g.setRotation(angle);

                let primaryColor = 0x55ffbb;
                let coreColor = 0xffffff;
                if (vfxType === 'mage_bolt' || vfxType === 'ice_shard') {
                    primaryColor = 0x44ccff;
                    coreColor = 0xe8ffff;
                } else if (vfxType === 'fire_arrow') {
                    primaryColor = 0xff6611;
                    coreColor = 0xfff4aa;
                } else if (vfxType === 'boss_fireball') {
                    primaryColor = 0xcc22ff;
                    coreColor = 0xffbbff;
                } else if (vfxType === 'wind_blade') {
                    primaryColor = 0x33ffaa;
                    coreColor = 0xe8fff5;
                }

                // 弓弦/杖端能量震波弧圈
                g.lineStyle(3, primaryColor, 0.90);
                g.beginPath();
                g.arc(0, 0, 14, -1.1, 1.1, false);
                g.strokePath();

                g.fillStyle(coreColor, 0.95);
                g.fillCircle(2, 0, 5.5);

                scene.tweens.add({
                    targets: g,
                    scaleX: 1.65,
                    scaleY: 1.65,
                    alpha: 0,
                    duration: 190,
                    ease: 'Cubic.easeOut',
                    onComplete: () => { if (g && g.destroy) g.destroy(); }
                });
            } catch (e) {}
        }

        // 天堂1風格 地面等距視角施法魔法陣特效
        function spawnGroundMagicCircleEffect(scene, x, y, radius, mainColorHex, subColorHex, durationMs = 550) {
            try {
                if (!scene || !scene.add) return;
                const circle = scene.add.graphics().setDepth(Math.max(10, y - 2));
                circle.setPosition(x, y + 18);

                const rx = radius;
                const ry = radius * 0.46;

                circle.lineStyle(2.5, mainColorHex, 0.88);
                circle.strokeEllipse(0, 0, rx * 2, ry * 2);
                circle.lineStyle(1.5, subColorHex, 0.78);
                circle.strokeEllipse(0, 0, rx * 1.56, ry * 1.56);

                // 六芒星幾何符文線條
                for (let i = 0; i < 6; i++) {
                    const a1 = (Math.PI * 2 * i) / 6;
                    const a2 = (Math.PI * 2 * ((i + 2) % 6)) / 6;
                    circle.beginPath();
                    circle.moveTo(Math.cos(a1) * rx * 0.86, Math.sin(a1) * ry * 0.86);
                    circle.lineTo(Math.cos(a2) * rx * 0.86, Math.sin(a2) * ry * 0.86);
                    circle.strokePath();
                }

                circle.setScale(0.35);
                scene.tweens.add({
                    targets: circle,
                    scaleX: 1.08,
                    scaleY: 1.08,
                    alpha: 0,
                    duration: durationMs,
                    ease: 'Cubic.easeOut',
                    onComplete: () => { if (circle && circle.destroy) circle.destroy(); }
                });
            } catch (e) {}
        }

        // 天堂1風格 飛行投射物 60FPS 即時粒子尾流 (風靈星屑 / 奧術雷芒 / 寒冰晶芒 / 烈焰火星 / 煉獄紫焰)
        function spawnProjectileTrailParticle(scene, proj) {
            try {
                if (!scene || !scene.add || !proj || !proj.active) return;
                const vfxType = proj.vfxType || 'elf_arrow';
                const angle = proj.rotation || 0;
                const tx = proj.x - Math.cos(angle) * 18 + (Math.random() - 0.5) * 8;
                const ty = proj.y - Math.sin(angle) * 18 + (Math.random() - 0.5) * 8;

                const p = scene.add.graphics().setDepth(9997);
                p.setPosition(tx, ty);

                if (vfxType === 'elf_arrow' || vfxType === 'wind_blade') {
                    p.fillStyle(0x66ffcc, 0.86);
                    p.fillCircle(0, 0, vfxType === 'wind_blade' ? 3.0 : 2.4);
                    p.lineStyle(1.6, 0xd8fff4, 0.80);
                    p.beginPath();
                    p.moveTo(0, 0);
                    p.lineTo(-Math.cos(angle) * 14, -Math.sin(angle) * 14);
                    p.strokePath();
                } else if (vfxType === 'mage_bolt' || vfxType === 'ice_shard') {
                    p.fillStyle(vfxType === 'ice_shard' ? 0xaaeeff : 0x66ccff, 0.88);
                    p.fillCircle(0, 0, 3.0);
                    p.lineStyle(1.6, vfxType === 'ice_shard' ? 0xffffff : 0xbb88ff, 0.82);
                    p.beginPath();
                    p.moveTo(-4, -3);
                    p.lineTo(4, 3);
                    p.strokePath();
                } else if (vfxType === 'fire_arrow') {
                    p.fillStyle(Math.random() > 0.4 ? 0xffaa22 : 0xff4400, 0.90);
                    p.fillCircle(0, 0, 3.4);
                } else {
                    p.fillStyle(0xd833ff, 0.85);
                    p.fillCircle(0, 0, 3.6);
                }

                scene.tweens.add({
                    targets: p,
                    x: tx - Math.cos(angle) * 10,
                    y: ty - Math.sin(angle) * 10 - (vfxType === 'fire_arrow' ? 6 : 0),
                    scaleX: 0.2,
                    scaleY: 0.2,
                    alpha: 0,
                    duration: 185,
                    ease: 'Quad.easeOut',
                    onComplete: () => { if (p && p.destroy) p.destroy(); }
                });
            } catch (e) {}
        }

        // 天堂1風格 投射物命中目標時的專屬華麗爆裂特效
        function spawnProjectileImpactEffect(scene, x, y, vfxType) {
            try {
                if (!scene || !scene.add) return;
                const g = scene.add.graphics().setDepth(y + 260);
                g.setPosition(x, y - 8);

                let ringColor = 0x55ffbb;
                let rayColor = 0xd8fff0;
                let rayCount = 8;
                let maxRadius = 28;

                if (vfxType === 'mage_bolt') {
                    ringColor = 0x44bbff;
                    rayColor = 0xcc99ff;
                    rayCount = 10;
                    maxRadius = 34;
                } else if (vfxType === 'ice_shard') {
                    ringColor = 0x55ddff;
                    rayColor = 0xffffff;
                    rayCount = 10;
                    maxRadius = 38;
                } else if (vfxType === 'wind_blade') {
                    ringColor = 0x33ffaa;
                    rayColor = 0xccffee;
                    rayCount = 10;
                    maxRadius = 36;
                } else if (vfxType === 'fire_arrow') {
                    ringColor = 0xff5511;
                    rayColor = 0xffee77;
                    rayCount = 12;
                    maxRadius = 44;
                } else if (vfxType === 'boss_fireball') {
                    ringColor = 0xbb11ff;
                    rayColor = 0xff66cc;
                    rayCount = 10;
                    maxRadius = 40;
                }

                g.fillStyle(0xffffff, 0.92);
                g.fillCircle(0, 0, maxRadius * 0.34);
                g.lineStyle(3.2, ringColor, 0.92);
                g.strokeCircle(0, 0, maxRadius * 0.56);

                g.lineStyle(2.2, rayColor, 0.95);
                for (let i = 0; i < rayCount; i++) {
                    const a = (Math.PI * 2 * i) / rayCount + (Math.random() * 0.25);
                    const r1 = 5;
                    const r2 = maxRadius * (0.72 + Math.random() * 0.38);
                    g.beginPath();
                    g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
                    g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
                    g.strokePath();
                }

                scene.tweens.add({
                    targets: g,
                    scaleX: 1.55,
                    scaleY: 1.55,
                    alpha: 0,
                    duration: 240,
                    ease: 'Cubic.easeOut',
                    onComplete: () => { if (g && g.destroy) g.destroy(); }
                });
            } catch (e) {}
        }

        // 清理目前遊戲回合的所有物件、視窗與計時器，支援死亡後直接無縫重新開始或讀取紀錄
        function cleanupGameSession() {
            isPlaying = false;
            isAttacking = false;
            joystickActive = false;
            targetPoint = null;
            targetEntity = null;
            pendingNpcAction = null;
            cancelEnchant();

            if (magicDragGhost) { magicDragGhost.destroy(); magicDragGhost = null; }
            draggingSpellId = null;
            draggingFromHotkeyIndex = -1;

            if (isInventoryOpen) { isInventoryOpen = false; inventoryUIElements.forEach(el => el.setVisible(false)); invItemsUI.forEach(el => el.destroy()); invItemsUI = []; }
            if (isStatsOpen) { isStatsOpen = false; statsUIElements.forEach(el => el.setVisible(false)); statsDynamicUI.forEach(el => el.destroy()); statsDynamicUI = []; }
            if (isShopOpen) { isShopOpen = false; shopUIElements.forEach(el => el.setVisible(false)); shopDynamicUI.forEach(el => el.destroy()); shopDynamicUI = []; }
            if (isMagicOpen) { isMagicOpen = false; magicUIElements.forEach(el => el.setVisible(false)); magicDynamicUI.forEach(el => el.destroy()); magicDynamicUI = []; }
            if (isWizardShopOpen) { isWizardShopOpen = false; wizardShopUIElements.forEach(el => el.setVisible(false)); wizardShopDynamicUI.forEach(el => el.destroy()); wizardShopDynamicUI = []; }
            hotkeyDynamicUI.forEach(el => { if (el && el.destroy) el.destroy(); });
            hotkeyDynamicUI = [];
            if (itemTooltip) itemTooltip.setVisible(false);
            if (uiGraphics) uiGraphics.clear();

            if (monsterSpawnTimer) {
                monsterSpawnTimer.remove(false);
                monsterSpawnTimer = null;
            }

            monsters.forEach(m => {
                if (m) {
                    if (m.walkTween) m.walkTween.stop();
                    if (m.nameTag) m.nameTag.destroy();
                    if (m.active) m.destroy();
                }
            });
            monsters = [];

            groundItems.forEach(item => { if (item && item.active) item.destroy(); });
            groundItems = [];

            projectiles.forEach(p => { if (p && p.active) p.destroy(); });
            projectiles = [];

            enemyProjectiles.forEach(p => { if (p && p.active) p.destroy(); });
            enemyProjectiles = [];

            mobileUIElements.forEach(el => { if (el && el.destroy) el.destroy(); });

                if (!saveData.worldVersion && saveData.x <= 6000 && saveData.y <= 6000) {

                } else {

            player = mainScene.physics.add.sprite(startX, startY, selectedClass); 
            player.setScale(0.86);

        function getStrBonus(str) { if (str >= 18) return 5; if (str >= 15) return 3; if (str >= 13) return 1; return 0; } function getDexDefBonus(dex) { return Math.floor(dex / 3); } function getIntMatkBonus(int) { if (int >= 18) return 6; if (int >= 15) return 3; if (int >= 12) return 1; return 0; } function getWisMrBonus(wis) { return wis * 2; }

        function recalculateCombatStats() {
            if (!player) return;
            const buffs = player.activeBuffs || {};
            const effStr = player.str + (buffs.str_bonus || 0);
            const effDex = player.dex + (buffs.dex_bonus || 0);

            let baseDef = getDexDefBonus(effDex) + Math.floor(player.level / 2) + (buffs.def_bonus || 0) - (buffs.berserk_def_penalty || 0); 
            let totalMr = getWisMrBonus(player.wis) + (player.level * 1); 
            let eqStrBonus = 0;
            let armorSlots = ['helmet', 'armor', 'gloves', 'shoes']; 
            armorSlots.forEach(slot => { 
                if (player.equipment[slot] && ItemDict[player.equipment[slot].id]) { 
                    let aData = ItemDict[player.equipment[slot].id]; 
                    baseDef += (aData.def || 0) + player.equipment[slot].enchant; 
                    totalMr += (aData.mr || 0); 
                    if (aData.strBonus) eqStrBonus += aData.strBonus;
                } 
            });
            if (player.equipment.weapon && ItemDict[player.equipment.weapon.id] && ItemDict[player.equipment.weapon.id].strBonus) {
                eqStrBonus += ItemDict[player.equipment.weapon.id].strBonus;
            }
            player.def = baseDef;
            player.er = Math.max(0, Math.floor(effDex / 2) + Math.floor(player.def / 2) + Math.floor((buffs.hit_bonus || 0) / 2));
            player.mr = totalMr;
            let strBonus = getStrBonus(effStr + eqStrBonus) + eqStrBonus + Math.floor((buffs.str_bonus || 0) * 0.8); 
            let intBonus = getIntMatkBonus(player.int);
            let wpnMin = 1; let wpnMax = 2; let wpnEnchant = 0; player.attackRange = 60; player.attackSpeed = 600; 
            if (player.equipment.weapon && ItemDict[player.equipment.weapon.id]) { 
                let wData = ItemDict[player.equipment.weapon.id]; 
                wpnMin = wData.minDmg; wpnMax = wData.maxDmg; wpnEnchant = player.equipment.weapon.enchant * 2; 
                player.attackSpeed = wData.baseSpeed; 
                if (wData.weaponType === 'ranged') player.attackRange = 350; 
                else if (wData.weaponType === 'magic') player.attackRange = 250; 
            }
            let spd = player.baseSpeed;
            let atkSpd = player.attackSpeed;
            if (player.hasHaste) { spd += 55; atkSpd = Math.floor(atkSpd * 0.78); }
            if (player.hasBrave) { spd += 45; atkSpd = Math.floor(atkSpd * 0.78); }
            if (buffs.berserk_dmg > 0) { spd += 25; atkSpd = Math.floor(atkSpd * 0.85); }
            player.speed = spd;
            player.attackSpeed = Math.max(160, atkSpd);

            let magicBonus = (buffs.magic_dmg_bonus || 0) + (buffs.berserk_dmg || 0);
            player.minDmg = wpnMin + strBonus + wpnEnchant + Math.floor(player.level / 4) + magicBonus; 
            player.maxDmg = wpnMax + strBonus + wpnEnchant + Math.floor(player.level / 4) + magicBonus; 
            player.matk = intBonus + Math.floor(player.level / 3); 
            if (player.equipment.weapon && ItemDict[player.equipment.weapon.id] && ItemDict[player.equipment.weapon.id].weaponType === 'magic') { player.matk += Math.floor(player.equipment.weapon.enchant / 2); }
        }

        function addItemToInventory(type, quantity = 1, enchant = 0) { let itemData = ItemDict[type]; if (!itemData) return false; if (itemData.stackable) { let existingSlot = player.inventory.find(slot => slot && slot.id === type); if (existingSlot) { existingSlot.count += quantity; return true; } } let emptyIndex = player.inventory.findIndex(slot => slot === null); if (emptyIndex !== -1) { player.inventory[emptyIndex] = { id: type, count: quantity, enchant: enchant }; return true; } return false; }
        function equipItem(invIndex) { let item = player.inventory[invIndex]; if (!item) return; let iData = ItemDict[item.id]; if (!iData || (iData.type !== 'weapon' && iData.type !== 'armor')) return; let slotName = iData.equipSlot; let oldEquip = player.equipment[slotName]; player.equipment[slotName] = { id: item.id, enchant: item.enchant }; if (oldEquip) player.inventory[invIndex] = { id: oldEquip.id, count: 1, enchant: oldEquip.enchant }; else player.inventory[invIndex] = null; recalculateCombatStats(); showFloatingText('裝備 ' + iData.name, player, '#ffff00'); updateUI(); }
        function unequipItem(slotName) { if (!player.equipment[slotName]) return; let emptyIndex = player.inventory.findIndex(slot => slot === null); if (emptyIndex !== -1) { let eq = player.equipment[slotName]; player.inventory[emptyIndex] = { id: eq.id, count: 1, enchant: eq.enchant }; showFloatingText('卸下 ' + (ItemDict[eq.id] ? ItemDict[eq.id].name : ''), player, '#aaaaaa'); player.equipment[slotName] = null; recalculateCombatStats(); updateUI(); } else showFloatingText('背包空間不足', player, '#ff0000'); }
        
        function processEnchant(scrollIndex, targetInfo) {
            let scroll = player.inventory[scrollIndex]; if (!scroll) { cancelEnchant(); return; }
            let targetItem = null; if (targetInfo.type === 'equip') targetItem = player.equipment[targetInfo.slot]; else if (targetInfo.type === 'inv') targetItem = player.inventory[targetInfo.index];
            if (!targetItem) { cancelEnchant(); return; } let tData = ItemDict[targetItem.id]; if (!tData) { cancelEnchant(); return; }
            if (pendingEnchantType === 'weapon' && tData.type !== 'weapon') { showFloatingText('只能對武器使用', player, '#ff0000'); cancelEnchant(); return; }
            if (pendingEnchantType === 'armor' && tData.type !== 'armor') { showFloatingText('只能對防具使用', player, '#ff0000'); cancelEnchant(); return; }
            let curEnchant = targetItem.enchant; let safe = tData.safeEnchant; let success = false; let destroyed = false;
            if (curEnchant < safe) { success = true; } else { let rate = 0; if (tData.type === 'weapon') rate = curEnchant < 8 ? 0.3 : 0.1; else rate = 0.25; if (Math.random() < rate) success = true; else destroyed = true; }
            if (success) { targetItem.enchant++; showFloatingText(tData.name + ' 強化成功! +' + targetItem.enchant, player, '#00ffff'); player.setTint(0x00ffff); setTimeout(() => { if(!player.isDead) player.clearTint(); }, 300); } 
            else if (destroyed) { if (targetInfo.type === 'equip') player.equipment[targetInfo.slot] = null; else if (targetInfo.type === 'inv') player.inventory[targetInfo.index] = null; showFloatingText('強化失敗... ' + tData.name + ' 碎裂', player, '#ff0000'); player.setTint(0xff0000); setTimeout(() => { if(!player.isDead) player.clearTint(); }, 500); mainScene.cameras.main.shake(300, 0.02); }
            scroll.count--; if (scroll.count <= 0) player.inventory[scrollIndex] = null;
            cancelEnchant(); recalculateCombatStats(); updateUI();
        }

        function cancelEnchant() { pendingEnchantScrollIndex = -1; pendingEnchantType = null; }

        function useItemAtIndex(index) {
            if (!player || player.isDead) return; let slot = player.inventory[index]; if (!slot) return; let itemData = ItemDict[slot.id]; if (!itemData) return;
            if (isShopOpen) { let sellPrice = Math.floor(itemData.price / 2); player.gold += sellPrice; showFloatingText('+' + sellPrice + ' G', player, '#ffff00'); slot.count--; if (slot.count <= 0) player.inventory[index] = null; updateUI(); return; }
            if (itemData.type === 'weapon' || itemData.type === 'armor') { equipItem(index); return; } let success = false;
            if (itemData.type === 'potion') {

                    mainScene.time.delayedCall(60000, () => {

                } else if (slot.id === 'bravepotion') {

                } else if (slot.id === 'elvenwafer') {

            else if (itemData.type === 'scroll_armor') { pendingEnchantScrollIndex = index; pendingEnchantType = 'armor'; showFloatingText('請選擇要強化的防具', player, '#ff00ff'); return; }
            else if (itemData.type === 'scroll_misc') {

        }
        function discardItem(index) { let slot = player.inventory[index]; if (!slot) return; player.inventory[index] = null; showFloatingText('丟棄物品', player, '#888888'); itemTooltip.setVisible(false); updateUI(); }

        function getStatusString() { if (!player) return ''; let classTitle = player.playerClass === 'knight' ? '騎士' : (player.playerClass === 'elf' ? '妖精' : '法師'); return `[${classTitle}] Lv.${player.level} HP:${player.hp}/${player.maxHp} MP:${player.mp}/${player.maxMp} | 天幣: ${player.gold} | 擊殺數: ${killCount}`; }

        function spawnSpellVfxSprite(scene, x, y, texKey, animKey, scale = 0.95, durationMs = 900) {
            if (!scene || !scene.add || !texKey || !scene.textures.exists(texKey)) return null;
            const eff = scene.add.sprite(x, y - 22, texKey).setDepth(9999).setScale(scale);
            if (Phaser.BlendModes) eff.setBlendMode(Phaser.BlendModes.ADD);
            if (animKey) safePlayAnim(eff, animKey);
            eff.on('animationcomplete', () => { if (eff && eff.active) eff.destroy(); });
            scene.time.delayedCall(durationMs, () => { if (eff && eff.active) eff.destroy(); });

        function findOrSelectMagicTarget(maxRange = 420) {
            if (targetEntity && !targetEntity.isDead && Phaser.Math.Distance.Between(player.x, player.y, targetEntity.x, targetEntity.y) <= maxRange + 80) {
                return targetEntity;
            }
            let nearest = null;
            let minDist = maxRange;
            for (let i = 0; i < monsters.length; i++) {
                const m = monsters[i];
                if (!m || m.isDead) continue;
                const d = Phaser.Math.Distance.Between(player.x, player.y, m.x, m.y);
                if (d <= minDist) {
                    minDist = d;
                    nearest = m;
                }
            }
            if (nearest) {
                targetEntity = nearest;
            }
            return nearest;
        }

                            // 燃燒的火球 (4級魔法)：命中時引爆火球範圍傷害與 Imagen 3.0 爆炎動畫
                            spawnGroundMagicCircleEffect(mainScene, m.x, m.y, proj.aoeRadius, 0xff5511, 0xffdd44, 720);
                            spawnSpellVfxSprite(mainScene, m.x, m.y, proj.aoeTex || 'eff_fireball_aoe', proj.aoeAnim || 'play_fireball_aoe', 0.96, 860);
                            if (mainScene.cameras && mainScene.cameras.main) {
                                mainScene.cameras.main.shake(180, 0.006);
                            }
                            monsters.forEach(otherM => {
                                if (!otherM.isDead && Phaser.Math.Distance.Between(m.x, m.y, otherM.x, otherM.y) <= proj.aoeRadius) {
                                    monsterTakeDamage(otherM, proj.damage);
                                }
                            });
                        } else {
                            if (proj.vfxType === 'fire_arrow' && mainScene.cameras && mainScene.cameras.main) {
                                mainScene.cameras.main.shake(90, 0.004);
                            }
                            monsterTakeDamage(m, proj.damage);
                        }
                        hasHit = true;
                        break;
                    }
                }
                if (hasHit) {
                    proj.destroy();
                    projectiles.splice(i, 1);
                }
            }
            
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) { 
                let proj = enemyProjectiles[i]; 
                if (proj.x < 0 || proj.x > WORLD_WIDTH || proj.y < 0 || proj.y > WORLD_HEIGHT) { proj.destroy(); enemyProjectiles.splice(i, 1); continue; } 
                if (!proj.lastTrailTime || time - proj.lastTrailTime > 48) {
                    proj.lastTrailTime = time;
                    spawnProjectileTrailParticle(mainScene, proj);
                }
                if (!player.isDead && Phaser.Math.Distance.Between(proj.x, proj.y, player.x, player.y) < 30) { 
                    spawnProjectileImpactEffect(mainScene, player.x, player.y, proj.vfxType || 'boss_fireball');
                    playerTakeDamage(proj.damage); 
                    proj.destroy(); enemyProjectiles.splice(i, 1); 
                } 
            }
        }

        function drawHpBar(entity, color, isBoss = false) {
            if (!entity || typeof entity.hp === 'undefined' || typeof entity.maxHp === 'undefined') return;
            const eHeight = entity.height || 32; const eScale = entity.scale || 1;
            const width = isBoss ? 80 : 40; const height = isBoss ? 8 : 6; 
            const yOffset = (entity.isMonster) ? (eHeight * eScale) / 2 + 10 : 30; 
            const x = entity.x - (width / 2); const y = entity.y - yOffset; const hpPercent = entity.hp / entity.maxHp;
            if(isNaN(x) || isNaN(y) || isNaN(hpPercent)) return; 
            uiGraphics.fillStyle(0x000000); uiGraphics.fillRect(x, y, width, height); 
            uiGraphics.fillStyle(color); uiGraphics.fillRect(x + 1, y + 1, (width - 2) * Math.max(0, hpPercent), height - 2);
            
            if (isBoss && entity.nameTag) { 
                entity.nameTag.setPosition(entity.x, entity.y - yOffset - 14);
                entity.nameTag.setDepth(entity.y + 501);
            }
            if (!entity.isMonster && entity.maxMp > 0) { const mpPercent = entity.mp / entity.maxMp; if(!isNaN(mpPercent)) { uiGraphics.fillStyle(0x000000); uiGraphics.fillRect(x, y + 7, width, 4); uiGraphics.fillStyle(0x0044ff); uiGraphics.fillRect(x + 1, y + 8, (width - 2) * Math.max(0, mpPercent), 2); } }
        }

        function spawnMonster(specificId = null, forcedX = null, forcedY = null) {
            if (!isPlaying || !player) return; if (!specificId && monsters.length >= MAX_MONSTERS) return; 
            try {
                if (typeof MonsterDictionary === 'undefined') return;
                let mData = null;
                if (specificId) { mData = MonsterDictionary[specificId]; } 
                else { const normalMonsterIds = Object.keys(MonsterDictionary).filter(key => !MonsterDictionary[key].isBoss); let randomId = Phaser.Math.RND.pick(normalMonsterIds); mData = MonsterDictionary[randomId]; }
                if (!mData) return;

                let randomX = forcedX;
                let randomY = forcedY;
                if (!forcedX) {
                    // 9倍大世界 (18000x18000)：約 45% 怪物生在玩家周圍狩獵圈 (520~3600px)，55% 分佈於全大陸各獵場
                    if (Math.random() < 0.45) {
                        const ang = Math.random() * Math.PI * 2;
                        const dist = Phaser.Math.Between(520, 3600);
                        randomX = Phaser.Math.Clamp(Math.round(player.x + Math.cos(ang) * dist), 150, WORLD_WIDTH - 150);
                        randomY = Phaser.Math.Clamp(Math.round(player.y + Math.sin(ang) * dist), 150, WORLD_HEIGHT - 150);
                    } else {
                        randomX = Phaser.Math.Between(150, WORLD_WIDTH - 150);
                        randomY = Phaser.Math.Between(150, WORLD_HEIGHT - 150);
                    }
                    // 避免一般怪物直接生在中央說話之島村莊安全廣場內 (9000, 9000)
                    if (Math.abs(randomX - TOWN_CENTER_X) < 520 && Math.abs(randomY - TOWN_CENTER_Y) < 520) {
                        const pushAng = Math.atan2(randomY - TOWN_CENTER_Y, randomX - TOWN_CENTER_X);
                        randomX = Math.round(TOWN_CENTER_X + Math.cos(pushAng) * Phaser.Math.Between(650, 2200));
                        randomY = Math.round(TOWN_CENTER_Y + Math.sin(pushAng) * Phaser.Math.Between(650, 2200));
                    }
                    if (Phaser.Math.Distance.Between(randomX, randomY, player.x, player.y) < 380) {
                        randomX += 560; randomY += 560;
                        if (randomX > WORLD_WIDTH - 150) randomX -= 1120;
                        if (randomY > WORLD_HEIGHT - 150) randomY -= 1120;
                    }
                }
                
                let m = mainScene.physics.add.sprite(randomX, randomY, mData.id); 
                m.setScale(mData.scale || 1); m.setInteractive(); m.isMonster = true; 
                if (m.body) {
                    m.body.setSize(Math.round(m.width * 0.52), Math.round(m.height * 0.52));
                    m.body.setOffset(Math.round(m.width * 0.24), Math.round(m.height * 0.36));
                }
                m.on('animationcomplete', function(anim) {
                    if (anim && anim.key && anim.key.endsWith('-attack') && m && m.active && !m.isDead) {
                        if (m.texture && m.texture.frameTotal > 1) m.setFrame(0);
                    }
                });
                
                m.monsterName = mData.name; 
                m.isBoss = mData.isBoss || false;
                m.isRanged = mData.isRanged || false;
                m.projectile = mData.projectile || null;
                m.projScale = mData.projScale || 1;
                
                m.hp = mData.stats?.hp || 50; m.maxHp = mData.stats?.hp || 50; m.minDmg = mData.stats?.minDmg || 2; m.maxDmg = mData.stats?.maxDmg || 5; m.speed = mData.stats?.speed || 50; m.expValue = mData.stats?.exp || 15; m.aggroRange = mData.stats?.aggroRange || 200; m.attackRange = mData.stats?.attackRange || 40; m.attackCooldown = mData.stats?.attackCooldown || 1500; m.lootTable = mData.lootTable || {}; m.isDead = false; m.lastAttackTime = 0; m.isProvoked = false; 
                
                m.setCollideWorldBounds(true); 
                if (!m.isBoss) { mainScene.physics.add.collider(m, obstacles); } 
                else { 
                    m.setDepth(m.y + 500); 
                    m.nameTag = mainScene.add.text(randomX, randomY - 60, `【 ${m.monsterName} 】`, { fontSize: '15px', fill: '#ff3333', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(randomY + 501);
                }
                
                m.alpha = 0; m.y = randomY - 50; 
                if (m.isBoss) { mainScene.cameras.main.shake(1000, 0.02); let warningText = mainScene.add.text(400, 200, `警告！【${m.monsterName}】已降臨！`, { fontSize: '48px', fill: '#ff0000', fontStyle: 'bold', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setScrollFactor(0).setDepth(20000); mainScene.tweens.add({ targets: warningText, alpha: 0, y: 100, duration: 4000, ease: 'Power1', onComplete: () => warningText.destroy() }); }
                mainScene.tweens.add({ targets: m, y: randomY, alpha: 1, duration: 500, ease: 'Bounce' }); m.walkTween = mainScene.tweens.add({ targets: m, angle: { from: -2.2, to: 2.2 }, duration: 220, yoyo: true, repeat: -1, paused: true }); monsters.push(m); 
            } catch (err) { console.warn("生成怪物時發生錯誤: ", err); }
        }

        function checkBossTrigger() {
            if (!player) return;
            if (player.level >= 10 && !bossTriggered.demon) { bossTriggered.demon = true; spawnMonster('demon', player.x + 300, player.y); }
            if (player.level >= 20 && !bossTriggered.death_knight) { bossTriggered.death_knight = true; spawnMonster('death_knight', player.x - 300, player.y + 100); }
            if (player.level >= 30 && !bossTriggered.bones_dragon) { bossTriggered.bones_dragon = true; spawnMonster('bones_dragon', player.x + 200, player.y - 250); }
        }

        function stopAttacking() { isAttacking = false; }

        function performAttack() {
            if (!targetEntity || targetEntity.isDead) { stopAttacking(); return; }
            breakInvisibility();
            cancelMeditationIfMoving();
            safePlayAnim(player, player.playerClass + '-attack', true); player.setFlipX(targetEntity.x < player.x);
            let totalDamage = Phaser.Math.Between(player.minDmg, player.maxDmg);
            let wId = (player.equipment.weapon && player.equipment.weapon.id) ? player.equipment.weapon.id : null;
            let wType = (wId && ItemDict[wId]) ? ItemDict[wId].weaponType : 'melee';
            const atkAngle = Phaser.Math.Angle.Between(player.x, player.y, targetEntity.x, targetEntity.y);
            
            if (wType === 'melee') { 
                let currentTarget = targetEntity; 
                // 產生天堂1經典劍氣揮砍弧光與微幅前衝打擊感
                spawnSlashArcEffect(mainScene, player.x, player.y, atkAngle, player.playerClass, wId);
                mainScene.tweens.add({
                    targets: player,
                    x: player.x + Math.cos(atkAngle) * 7,
                    y: player.y + Math.sin(atkAngle) * 7,
                    duration: 75,
                    yoyo: true,
                    ease: 'Quad.easeOut'
                });
                mainScene.time.delayedCall(120, () => { 
                    if (currentTarget && !currentTarget.isDead && player && !player.isDead && Phaser.Math.Distance.Between(player.x, player.y, currentTarget.x, currentTarget.y) <= player.attackRange + 28) { 
                        monsterTakeDamage(currentTarget, totalDamage); 
                        if (!currentTarget.isDead) {
                            mainScene.tweens.add({
                                targets: currentTarget,
                                x: currentTarget.x + Math.cos(atkAngle) * 7,
                                y: currentTarget.y + Math.sin(atkAngle) * 7,
                                duration: 55,
                                yoyo: true
                            });
                        }
                    } 
                }); 
            } else { 
                let projKey = wType === 'ranged' ? 'arrow' : 'eff_magicarrow'; 
                let animKey = wType === 'ranged' ? 'arrow-fly' : 'play_magicarrow'; 
                let projScale = wType === 'ranged' ? 0.68 : 0.72; 
                let vfxType = wType === 'ranged' ? 'elf_arrow' : 'mage_bolt';

                spawnCastMuzzleEffect(mainScene, player.x, player.y, atkAngle, vfxType);
                if (wType === 'magic') {
                    spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 38, 0x44bbff, 0xaa66ff, 380);
                }
                
                let proj = mainScene.physics.add.sprite(player.x + Math.cos(atkAngle) * 16, player.y - 6 + Math.sin(atkAngle) * 16, projKey).setScale(projScale); 
                proj.setDepth(9999);
                proj.damage = totalDamage; 
                proj.vfxType = vfxType;
                if (wType === 'magic' && Phaser.BlendModes) {
                    proj.setBlendMode(Phaser.BlendModes.ADD);
                }
                safePlayAnim(proj, animKey); 
                proj.setRotation(atkAngle); 
                mainScene.physics.velocityFromRotation(atkAngle, wType === 'ranged' ? 640 : 580, proj.body.velocity); 
                projectiles.push(proj); 
            }
        }

        function performMagicAttack(overrideSpellId = null) {
            if (!isPlaying || !player || player.isDead) return;
            if (player.spells.length === 0) {
                showFloatingText('尚未學會魔法，請在出生點找【大魔法師吉倫】付費學習', player, '#d896ff');
                return;
            }

            let spellId = overrideSpellId || (player.magicHotkeys && player.magicHotkeys[currentHotkeyIndex]);
            if (!spellId) {
                showFloatingText(`魔法熱鍵 ${currentHotkeyIndex + 1} 尚無魔法，請從【魔法】書拖曳至熱鍵`, player, '#00ffff');
                return;
            }
            let spell = MagicDict[spellId];
            if (!spell) return;

            if (player.mp < spell.mp) { showFloatingText('魔力不足', player, '#aaaaaa'); return; }

            let now = mainScene.time.now;
            if (now < player.lastMagicTime + 650) return;

            // 需要單一目標的攻擊型魔法自動搜尋或檢查目標
            const needsSingleTarget = ['attack_single', 'attack_target_aoe', 'attack_strike', 'attack_drain_hp', 'attack_drain_mp'].includes(spell.type);
            let castTarget = null;
            if (needsSingleTarget) {
                castTarget = findOrSelectMagicTarget(430);
                if (!castTarget || castTarget.isDead) {
                    showFloatingText('範圍內無可鎖定目標', player, '#aaaaaa');
                    return;
                }
            }

            player.lastMagicTime = now;
            player.mp -= spell.mp;
            updateUI();
            safePlayAnim(player, player.playerClass + '-attack', true);

            const totalPower = Math.floor((spell.baseVal || 0) + (player.matk * (spell.matkMult || 0)));

            // 攻擊類魔法會解除隱身與冥想
            if (spell.type.startsWith('attack_') || spell.type === 'summon_icewall') {
                breakInvisibility();
                cancelMeditationIfMoving();
            }

            // ================= 1. 治癒系魔法 (初級治癒術 / 中級治癒術 / 高級治癒術) =================
            if (spell.type === 'heal') {
                player.hp = Math.min(player.maxHp, player.hp + totalPower);
                showFloatingText(`${spell.name} +${totalPower} HP`, player, '#00ff88');
                const ringColor = spell.tier >= 5 ? 0xffee66 : 0x55ffcc;
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 56 + spell.tier * 4, ringColor, 0xffffff, 900);
                spawnSpellVfxSprite(mainScene, player.x, player.y, spell.texKey || 'eff_heal_light', spell.animKey || 'play_heal_light', spell.tier >= 5 ? 1.05 : 0.92, 920);
                updateUI();
            }
            // ================= 2. 防禦護盾系 (保護罩 / 鎧甲護持) =================
            else if (spell.type === 'buff_def') {
                player.activeBuffs.def_bonus = spell.defBonus;
                recalculateCombatStats();
                showFloatingText(`${spell.name} (DEF +${spell.defBonus})`, player, '#ffee77');
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 62, 0xffcc44, 0xffeeaa, 920);
                spawnSpellVfxSprite(mainScene, player.x, player.y, spell.texKey || 'eff_shield', spell.animKey || 'play_shield', 0.96, 920);
                updateUI();
                mainScene.time.delayedCall(spell.duration, () => {
                    if (player && !player.isDead && player.activeBuffs.def_bonus === spell.defBonus) {
                        player.activeBuffs.def_bonus = 0;
                        recalculateCombatStats();
                        updateUI();
                        showFloatingText(`${spell.name}效果消失`, player, '#aaaaaa');
                    }
                });
            }
            // ================= 3. 武器祝福附魔系 (神聖武器 / 擬似魔法武器 / 祝福魔法武器) =================
            else if (spell.type === 'buff_weapon') {
                const dmgBonus = Math.max(spell.baseVal || 2, totalPower);
                player.activeBuffs.magic_dmg_bonus = dmgBonus;
                player.activeBuffs.hit_bonus = spell.hitBonus || 2;
                recalculateCombatStats();
                showFloatingText(`${spell.name} (攻擊+${dmgBonus})`, player, '#66ddff');
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 64, 0x4499ff, 0xffdd55, 920);
                spawnSpellVfxSprite(mainScene, player.x, player.y, spell.texKey || 'eff_holy_weapon', spell.animKey || 'play_holy_weapon', 0.96, 920);
                updateUI();
                mainScene.time.delayedCall(spell.duration, () => {
                    if (player && !player.isDead && player.activeBuffs.magic_dmg_bonus === dmgBonus) {
                        player.activeBuffs.magic_dmg_bonus = 0;
                        player.activeBuffs.hit_bonus = 0;
                        recalculateCombatStats();
                        updateUI();
                        showFloatingText(`${spell.name}效果消失`, player, '#aaaaaa');
                    }
                });
            }
            // ================= 4. 屬性強化系 (力量提升 / 敏捷提升 / 通暢氣脈術 / 體魄強健術) =================
            else if (spell.type === 'buff_stat') {
                if (spell.stat === 'str') {
                    player.activeBuffs.str_bonus = spell.statBonus;
                    showFloatingText(`${spell.name} (STR +${spell.statBonus})`, player, '#ff8844');
                    spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 60, 0xff5522, 0xffcc44, 900);
                } else {
                    player.activeBuffs.dex_bonus = spell.statBonus;
                    showFloatingText(`${spell.name} (DEX +${spell.statBonus})`, player, '#44ffbb');
                    spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 60, 0x33ffaa, 0xaaffee, 900);
                }
                spawnSpellVfxSprite(mainScene, player.x, player.y, spell.texKey || 'eff_str_up', spell.animKey || 'play_str_up', 0.94, 920);
                recalculateCombatStats();
                updateUI();
                mainScene.time.delayedCall(spell.duration, () => {
                    if (!player || player.isDead) return;
                    if (spell.stat === 'str' && player.activeBuffs.str_bonus === spell.statBonus) player.activeBuffs.str_bonus = 0;
                    if (spell.stat === 'dex' && player.activeBuffs.dex_bonus === spell.statBonus) player.activeBuffs.dex_bonus = 0;
                    recalculateCombatStats();
                    updateUI();
                    showFloatingText(`${spell.name}效果消失`, player, '#aaaaaa');
                });
            }
            // ================= 5. 冥想術 (原地靜止加速回魔，移動或受擊即中斷) =================
            else if (spell.type === 'buff_meditation') {
                stopAttacking();
                targetPoint = null;
                if (player.body) player.body.setVelocity(0);
                player.activeBuffs.is_meditating = true;
                player.activeBuffs.mp_regen_bonus = spell.mpRegenBonus || 18;
                showFloatingText('冥想術啟動 (靜止大幅回復MP)', player, '#66eeff');
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 66, 0x33ccff, 0x88ffee, 1000);
                spawnSpellVfxSprite(mainScene, player.x, player.y, spell.texKey || 'eff_meditation', spell.animKey || 'play_meditation', 0.95, 950);
                mainScene.time.delayedCall(spell.duration, () => {
                    if (player && !player.isDead && player.activeBuffs.is_meditating) {
                        player.activeBuffs.is_meditating = false;
                        player.activeBuffs.mp_regen_bonus = 0;
                        showFloatingText('冥想術時間結束', player, '#aaaaaa');
                    }
                });
            }
            // ================= 6. 狂暴術 (降低防禦、極限提升近戰攻擊與攻速) =================
            else if (spell.type === 'buff_berserk') {
                player.activeBuffs.berserk_dmg = spell.dmgBonus || 12;
                player.activeBuffs.berserk_def_penalty = spell.defPenalty || 6;
                recalculateCombatStats();
                showFloatingText(`狂暴術！(ATK +${spell.dmgBonus} / DEF -${spell.defPenalty})`, player, '#ff3333');
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 68, 0xff2222, 0xffaa33, 950);
                spawnSpellVfxSprite(mainScene, player.x, player.y, spell.texKey || 'eff_berserkers', spell.animKey || 'play_berserkers', 1.05, 950);
                updateUI();
                mainScene.time.delayedCall(spell.duration, () => {
                    if (player && !player.isDead && player.activeBuffs.berserk_dmg > 0) {
                        player.activeBuffs.berserk_dmg = 0;
                        player.activeBuffs.berserk_def_penalty = 0;
                        recalculateCombatStats();
                        updateUI();
                        showFloatingText('狂暴術效果消失', player, '#aaaaaa');
                    }
                });
            }
            // ================= 7. 加速術 / 強力加速術 =================
            else if (spell.type === 'buff_haste' || spell.type === 'buff_greater_haste') {
                player.hasHaste = true;
                if (spell.type === 'buff_greater_haste') player.hasBrave = true;
                recalculateCombatStats();
                showFloatingText(spell.type === 'buff_greater_haste' ? '強力加速術 (雙段高階加速)' : '加速術 (綠水加速狀態)', player, '#33ff99');
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 66, 0x22ff88, 0xaaffee, 950);
                spawnSpellVfxSprite(mainScene, player.x, player.y, spell.texKey || 'eff_haste', spell.animKey || 'play_haste', 1.0, 950);
                updateUI();
                mainScene.time.delayedCall(spell.duration, () => {
                    if (!player || player.isDead) return;
                    player.hasHaste = false;
                    if (spell.type === 'buff_greater_haste') player.hasBrave = false;
                    recalculateCombatStats();
                    updateUI();
                    showFloatingText(`${spell.name}效果消失`, player, '#aaaaaa');
                });
            }
            // ================= 8. 靈魂昇華 (提升最大 HP 與最大 MP 上限 +25%) =================
            else if (spell.type === 'buff_spirit') {
                if (player.activeBuffs.spirit_hp_bonus > 0) {
                    player.maxHp -= player.activeBuffs.spirit_hp_bonus;
                    player.maxMp -= player.activeBuffs.spirit_mp_bonus;
                }
                const hpAdd = Math.max(30, Math.floor(player.maxHp * (spell.hpPct || 0.25)));
                const mpAdd = Math.max(30, Math.floor(player.maxMp * (spell.mpPct || 0.25)));
                player.activeBuffs.spirit_hp_bonus = hpAdd;
                player.activeBuffs.spirit_mp_bonus = mpAdd;
                player.maxHp += hpAdd;
                player.maxMp += mpAdd;
                player.hp = Math.min(player.maxHp, player.hp + hpAdd);
                player.mp = Math.min(player.maxMp, player.mp + mpAdd);
                showFloatingText(`靈魂昇華 (MaxHP+${hpAdd} / MaxMP+${mpAdd})`, player, '#ffdd44');
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 74, 0xffcc33, 0xffffff, 1050);
                spawnSpellVfxSprite(mainScene, player.x, player.y, spell.texKey || 'eff_advance_spirit', spell.animKey || 'play_advance_spirit', 1.08, 1000);
                updateUI();
                mainScene.time.delayedCall(spell.duration, () => {
                    if (!player || player.isDead || player.activeBuffs.spirit_hp_bonus !== hpAdd) return;
                    player.maxHp = Math.max(10, player.maxHp - hpAdd);
                    player.maxMp = Math.max(10, player.maxMp - mpAdd);
                    player.hp = Math.min(player.hp, player.maxHp);
                    player.mp = Math.min(player.mp, player.maxMp);
                    player.activeBuffs.spirit_hp_bonus = 0;
                    player.activeBuffs.spirit_mp_bonus = 0;
                    updateUI();
                    showFloatingText('靈魂昇華效果消失', player, '#aaaaaa');
                });
            }
            // ================= 9. 隱身術 (完全隱形、解除怪物鎖定) =================
            else if (spell.type === 'buff_invis') {
                stopAttacking();
                player.activeBuffs.is_invisible = true;
                player.setAlpha(0.42);
                monsters.forEach(m => { if (m && !m.isDead) m.isProvoked = false; });
                showFloatingText('隱身術 (怪物無法直接鎖定)', player, '#aaeeff');
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 62, 0x66ddff, 0xffffff, 900);
                spawnSpellVfxSprite(mainScene, player.x, player.y, spell.texKey || 'eff_invisibility', spell.animKey || 'play_invisibility', 0.92, 900);
                mainScene.time.delayedCall(spell.duration, () => {
                    if (player && !player.isDead && player.activeBuffs.is_invisible) {
                        breakInvisibility();
                    }
                });
            }
            // ================= 10. 單體飛行投射魔法 (風刃 / 寒冰打擊) & 燃燒的火球 =================
            else if (spell.type === 'attack_single' || spell.type === 'attack_target_aoe') {
                player.setFlipX(castTarget.x < player.x);
                const angle = Phaser.Math.Angle.Between(player.x, player.y, castTarget.x, castTarget.y);
                const vfxType = spell.vfxType || 'fire_arrow';
                const ringCol = spell.element === 'wind' ? 0x33ffaa : (spell.element === 'water' ? 0x33ccff : 0xff5511);
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 48, ringCol, 0xffffff, 540);
                spawnCastMuzzleEffect(mainScene, player.x, player.y, angle, vfxType);

                const pKey = spell.projKey || 'eff_windblade';
                const pAnim = spell.projAnim || 'play_windblade';
                let proj = mainScene.physics.add.sprite(player.x + Math.cos(angle) * 18, player.y - 6 + Math.sin(angle) * 18, pKey).setScale(0.86);
                proj.setDepth(9999);
                proj.damage = totalPower;
                proj.vfxType = vfxType;
                if (spell.type === 'attack_target_aoe') {
                    proj.aoeRadius = spell.radius || 135;
                    proj.aoeTex = spell.texKey || 'eff_fireball_aoe';
                    proj.aoeAnim = spell.animKey || 'play_fireball_aoe';
                }
                if (Phaser.BlendModes) proj.setBlendMode(Phaser.BlendModes.ADD);
                proj.setRotation(angle);
                safePlayAnim(proj, pAnim);
                mainScene.physics.velocityFromRotation(angle, 640, proj.body.velocity);
                projectiles.push(proj);
            }
            // ================= 11. 單體天降/爆發魔法 (極道落雷 / 冰錐 / 聖光 / 地裂術 / 震裂術) =================
            else if (spell.type === 'attack_strike') {
                player.setFlipX(castTarget.x < player.x);
                const tx = castTarget.x;
                const ty = castTarget.y;
                const circleCol = spell.element === 'wind' ? 0x55ddff : (spell.element === 'water' ? 0x33bbff : (spell.element === 'holy' ? 0xffee66 : 0xff9933));
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 48, circleCol, 0xffffff, 580);
                spawnGroundMagicCircleEffect(mainScene, tx, ty, 64, circleCol, 0xffffff, 820);
                spawnSpellVfxSprite(mainScene, tx, ty, spell.texKey || 'eff_lightning_bolt', spell.animKey || 'play_lightning_bolt', spell.tier >= 5 ? 1.08 : 0.96, 880);
                if (mainScene.cameras && mainScene.cameras.main) {
                    mainScene.cameras.main.shake(spell.tier >= 6 ? 240 : 140, spell.tier >= 6 ? 0.008 : 0.005);
                }
                spawnProjectileImpactEffect(mainScene, tx, ty, spell.vfxType || 'mage_bolt');
                monsterTakeDamage(castTarget, totalPower);
            }
            // ================= 12. 吸血鬼之吻 (HP汲取) & 魔力奪取 (MP吸取) =================
            else if (spell.type === 'attack_drain_hp' || spell.type === 'attack_drain_mp') {
                player.setFlipX(castTarget.x < player.x);
                const tx = castTarget.x;
                const ty = castTarget.y;
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 52, 0xcc2288, 0xaa44ff, 750);
                spawnGroundMagicCircleEffect(mainScene, tx, ty, 58, 0xff2266, 0x9922ff, 800);
                spawnSpellVfxSprite(mainScene, tx, ty, spell.texKey || 'eff_vampiric_touch', spell.animKey || 'play_vampiric_touch', 0.96, 880);

                // 繪製目標至施法者的暗紅/紫羅蘭能量汲取光束
                const drainBeam = mainScene.add.graphics().setDepth(9998);
                drainBeam.lineStyle(4, spell.type === 'attack_drain_hp' ? 0xff2266 : 0xbb44ff, 0.88);
                drainBeam.beginPath();
                drainBeam.moveTo(tx, ty - 14);
                drainBeam.lineTo(player.x, player.y - 14);
                drainBeam.strokePath();
                mainScene.tweens.add({
                    targets: drainBeam,
                    alpha: 0,
                    duration: 420,
                    onComplete: () => { if (drainBeam && drainBeam.destroy) drainBeam.destroy(); }
                });

                monsterTakeDamage(castTarget, totalPower);
                if (spell.type === 'attack_drain_hp') {
                    const healVal = Math.max(8, Math.floor(totalPower * 0.75));
                    player.hp = Math.min(player.maxHp, player.hp + healVal);
                    showFloatingText(`吸血 +${healVal} HP`, player, '#ff5599');
                } else {
                    const mpGain = Math.max(15, Math.min(48, Math.floor(totalPower * 0.45)));
                    player.mp = Math.min(player.maxMp, player.mp + mpGain);
                    showFloatingText(`奪取 +${mpGain} MP`, player, '#cc77ff');
                }
                updateUI();
            }
            // ================= 13. 前方扇形吐息/噴射魔法 (寒冰氣息 / 火焰噴射) =================
            else if (spell.type === 'attack_cone') {
                const refTarget = findOrSelectMagicTarget(spell.radius || 200);
                let faceAngle = player.flipX ? Math.PI : 0;
                if (refTarget && !refTarget.isDead) {
                    faceAngle = Phaser.Math.Angle.Between(player.x, player.y, refTarget.x, refTarget.y);
                    player.setFlipX(Math.cos(faceAngle) < 0);
                }
                const coneRadius = spell.radius || 185;
                const coneColor = spell.element === 'water' ? 0x44ccff : 0xff5511;
                spawnGroundMagicCircleEffect(mainScene, player.x, player.y, 50, coneColor, 0xffffff, 650);

                // 於前方扇形展開 3 道華麗 Imagen 3.0 元素噴射特效
                for (let b = -1; b <= 1; b++) {
                    const a = faceAngle + b * 0.36;
                    const bx = player.x + Math.cos(a) * (coneRadius * 0.56);
                    const by = player.y + Math.sin(a) * (coneRadius * 0.56);
                    spawnSpellVfxSprite(mainScene, bx, by, spell.texKey || 'eff_fire_cone', spell.animKey || 'play_fire_cone', 0.82, 820);
                }

                monsters.forEach(m => {
                    if (!m.isDead) {
                        const d = Phaser.Math.Distance.Between(player.x, player.y, m.x, m.y);
                        if (d <= coneRadius) {
                            const mAngle = Phaser.Math.Angle.Between(player.x, player.y, m.x, m.y);
                            const diff = Math.abs(Phaser.Math.Angle.Wrap(mAngle - faceAngle));
                            if (diff <= 1.15 || d <= 65) {
                                spawnProjectileImpactEffect(mainScene, m.x, m.y, spell.vfxType || 'fire_arrow');
                                monsterTakeDamage(m, totalPower);
                            }
                        }
                    }
                });
            }
            // ================= 14. 冰矛圍籬 (召喚環狀冰牆阻擋凍結怪物) =================
            else if (spell.type === 'summon_icewall') {
                const cx = player.x;
                const cy = player.y;
                const wallRadius = spell.radius || 135;
                spawnGroundMagicCircleEffect(mainScene, cx, cy, wallRadius, 0x44ddff, 0xffffff, 1200);

                // 環繞召喚 8 座晶瑩冰矛屏障
                for (let k = 0; k < 8; k++) {
                    const a = (Math.PI * 2 * k) / 8;
                    const ix = cx + Math.cos(a) * (wallRadius * 0.76);
                    const iy = cy + Math.sin(a) * (wallRadius * 0.56);
                    spawnSpellVfxSprite(mainScene, ix, iy, spell.texKey || 'eff_ice_lance_wall', spell.animKey || 'play_ice_lance_wall', 0.68, 1300);
                }

                monsters.forEach(m => {
                    if (!m.isDead && Phaser.Math.Distance.Between(cx, cy, m.x, m.y) <= wallRadius + 25) {
                        m.frozenUntil = now + (spell.duration || 6000);
                        m.setTint(0x66ddff);
                        if (m.body) m.body.setVelocity(0);
                        showFloatingText('冰封阻擋!', m, '#66eeff');
                        monsterTakeDamage(m, totalPower);
                    }
                });
            }
            // ================= 15. 全範圍風暴與連續暴風雪 (絕冬凍氣 / 冰雪暴 / 火風暴) =================
            else if (spell.type === 'attack_aoe' || spell.type === 'attack_aoe_dot') {
                const cx = player.x;
                const cy = player.y;
                const radius = spell.radius || 180;
                const isIce = (spell.element === 'water');
                const mainCol = isIce ? 0x33ccff : 0xff4400;
                const subCol = isIce ? 0xaaeeff : 0xffbb22;
                const waves = spell.waves || 1;

                const triggerStormWave = (waveIdx) => {
                    if (!mainScene || !mainScene.add || !player || player.isDead) return;
                    const wx = player.x;
                    const wy = player.y;
                    spawnGroundMagicCircleEffect(mainScene, wx, wy, radius, mainCol, subCol, 950);
                    if (mainScene.cameras && mainScene.cameras.main) {
                        mainScene.cameras.main.shake(260, 0.007);
                    }
                    spawnSpellVfxSprite(mainScene, wx, wy, spell.texKey || 'eff_fire_storm', spell.animKey || 'play_fire_storm', 1.16, 920);

                    for (let k = 0; k < 4; k++) {
                        const subAngle = (Math.PI * 0.5 * k) + (waveIdx * 0.45);
                        const sx = wx + Math.cos(subAngle) * (radius * 0.58);
                        const sy = wy + Math.sin(subAngle) * (radius * 0.42);
                        mainScene.time.delayedCall(55 * (k + 1), () => {
                            spawnSpellVfxSprite(mainScene, sx, sy, spell.texKey || 'eff_fire_storm', spell.animKey || 'play_fire_storm', 0.66, 850);
                        });
                    }

                    monsters.forEach(m => {
                        if (!m.isDead && Phaser.Math.Distance.Between(wx, wy, m.x, m.y) <= radius) {
                            if (isIce) {
                                m.slowUntil = mainScene.time.now + 4000;
                            }
                            spawnProjectileImpactEffect(mainScene, m.x, m.y, spell.vfxType || 'fire_arrow');
                            monsterTakeDamage(m, totalPower);
                        }
                    });
                };

                triggerStormWave(0);
                for (let w = 1; w < waves; w++) {
                    mainScene.time.delayedCall(w * 650, () => triggerStormWave(w));
                }
            }
        }

        function monsterTakeDamage(m, damage) {
            if (m.isDead) return; 
            m.hp -= damage; 
            m.isProvoked = true; 
            if (m.hp < 0) m.hp = 0; 
            
            spawnHitSparkEffect(mainScene, m.x, m.y, 0xffdd66);
            showFloatingText('-' + damage, m, '#ffffff'); m.setTint(0xff0000); setTimeout(() => { if (!m.isDead) m.clearTint(); }, 200);
            if (m.hp <= 0) {
                m.isDead = true; 
                if (m.body) { m.body.setVelocity(0); m.body.enable = false; }
                if (m.nameTag) { m.nameTag.destroy(); m.nameTag = null; }
                m.walkTween.stop(); if (m.anims) m.anims.stop(); if (targetEntity === m) { stopAttacking(); targetEntity = null; } monsters = monsters.filter(monster => monster !== m);
                
                if (!m.isBoss) { killCount++; }

                let dropGold = Phaser.Math.Between(m.expValue, m.expValue * 3); player.gold += dropGold;

                player.exp += m.expValue;
                while (player.exp >= player.maxExp) { 
                    player.level++; player.exp -= player.maxExp; player.maxExp = Math.floor(player.maxExp * 1.5); player.statPoints += 1; 
                    let hpGrowth = Math.max(1, Math.floor(player.con / 2) + Phaser.Math.Between(0, 3)); let mpGrowth = Math.max(1, Math.floor(player.wis / 3) + Phaser.Math.Between(0, 2));
                    player.maxHp += hpGrowth; player.hp = player.maxHp; player.maxMp += mpGrowth; player.mp = player.maxMp; 
                    recalculateCombatStats(); showFloatingText('LEVEL UP!', player, '#ffff00'); player.setTint(0xffff00); setTimeout(() => { if (!player.isDead) player.clearTint(); }, 600); 
                    saveGame(); 
                }
                
                // 升級後判斷是否觸發Boss
                checkBossTrigger();
                
                updateUI(); showFloatingText(`EXP +${m.expValue} \n$ +${dropGold}`, player, '#aaaaaa');

                let dropRoll = Math.random(); let cumulative = 0; let droppedItemType = null;
                for (let key in m.lootTable) { cumulative += m.lootTable[key]; if (dropRoll < cumulative) { droppedItemType = key; break; } }
                if (Math.random() < 0.05 && !m.isBoss) { let wps = ['sword', 'bow', 'wand', 'hat', 'clothing', 'gloves', 'shoe']; droppedItemType = wps[Math.floor(Math.random() * wps.length)]; }
                if (droppedItemType && ItemDict[droppedItemType]) { 
                    let dScale = ItemDict[droppedItemType].scale || 1;
                    let dropItem = mainScene.physics.add.sprite(m.x, m.y, droppedItemType).setScale(dScale); 
                    dropItem.itemType = droppedItemType; dropItem.setDepth(m.y); 
                    dropItem.setInteractive(); 
                    dropItem.on('pointerover', (pointer) => { let p = getTooltipPos(pointer); itemTooltip.setText(getItemTooltipText(droppedItemType)); itemTooltip.setPosition(p.x, p.y); itemTooltip.setVisible(true); }); 
                    dropItem.on('pointerout', () => { itemTooltip.setVisible(false); }); 
                    dropItem.on('pointermove', (pointer) => { let p = getTooltipPos(pointer); itemTooltip.setPosition(p.x, p.y); });
                    mainScene.tweens.add({ targets: dropItem, y: m.y - 20, duration: 200, yoyo: true }); groundItems.push(dropItem); 
                }
                mainScene.tweens.add({ targets: m, scale: 0, angle: 180, duration: 500, onComplete: function() { m.destroy(); } });
            }
        }

        function playerTakeDamage(damage) {
            if (!player || player.isDead) return;
            cancelMeditationIfMoving();
            breakInvisibility();
            player.hp -= damage; if (player.hp < 0) player.hp = 0; updateUI(); 
            spawnHitSparkEffect(mainScene, player.x, player.y, 0xff4433);
            showFloatingText('-' + damage, player, '#ff0000'); player.setTint(0xff0000); 
            setTimeout(() => { if (player && !player.isDead) player.clearTint(); }, 200);
            
            if (player.hp <= 0 && !player.isDead) { 
                player.isDead = true; 
                joystickActive = false;
                if (player.body) player.body.setVelocity(0); 
                stopAttacking(); 
                mainScene.tweens.add({ targets: player, angle: 90, alpha: 0.5, duration: 500 }); 
                
                // 清理舊的死亡選單 (若有)
                deathUIElements.forEach(el => { if (el && el.destroy) el.destroy(); });
                deathUIElements = [];

                const currentClass = player.playerClass || 'knight';

                // 直接使用螢幕座標 + setScrollFactor(0)，徹底解決 Phaser 3 Container 在鏡頭跟隨捲動後按鈕判定區偏移導致點擊無反應的 Bug
