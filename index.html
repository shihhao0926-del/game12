                bg.fillRect(0, 0, 800, 600);
                bg.lineStyle(3, 0x882222, 0.9);
                bg.strokeRect(140, 130, 520, 320);
                bg.setInteractive(new Phaser.Geom.Rectangle(0, 0, 800, 600), Phaser.Geom.Rectangle.Contains);
                bg.on('pointerdown', (pointer, lx, ly, event) => { if (event) event.stopPropagation(); });

                let deathText = mainScene.add.text(400, 210, 'YOU DIED', {
                    fontSize: '64px', fill: '#ff0000', fontStyle: 'bold', stroke: '#000', strokeThickness: 6
                }).setOrigin(0.5).setScrollFactor(0).setDepth(25001); 

                let tipText = mainScene.add.text(400, 275, '您已在亞丁大陸倒下，請選擇復活方式', {
                    fontSize: '18px', fill: '#cccccc', stroke: '#000', strokeThickness: 3
                }).setOrigin(0.5).setScrollFactor(0).setDepth(25001);
                
                let restartBtn = mainScene.add.text(280, 355, '重新開始', {
                    fontSize: '24px', fill: '#ffffff', backgroundColor: '#880000', padding: { x: 24, y: 12 }
                }).setOrigin(0.5).setScrollFactor(0).setDepth(25002).setInteractive({ useHandCursor: true });
                restartBtn.on('pointerover', () => restartBtn.setBackgroundColor('#bb1111'));
                restartBtn.on('pointerout', () => restartBtn.setBackgroundColor('#880000'));
                restartBtn.on('pointerdown', (pointer, lx, ly, event) => { 
                    if (event) event.stopPropagation();
                    cleanupGameSession();
                    showClassSelection();
                });
                
                let loadBtn = mainScene.add.text(520, 355, '從記錄開始', {
                    fontSize: '24px', fill: '#ffffff', backgroundColor: '#000088', padding: { x: 24, y: 12 }
                }).setOrigin(0.5).setScrollFactor(0).setDepth(25002).setInteractive({ useHandCursor: true });
                loadBtn.on('pointerover', () => loadBtn.setBackgroundColor('#1133cc'));
                loadBtn.on('pointerout', () => loadBtn.setBackgroundColor('#000088'));
                loadBtn.on('pointerdown', (pointer, lx, ly, event) => { 
                    if (event) event.stopPropagation();
                    let saveData = getSavedGameData();
                    if (saveData) {
                        startGame(saveData.playerClass || currentClass, saveData);
                    } else {
                        startGame(currentClass, null);
                    }
                });
                
                deathUIElements.push(bg, deathText, tipText, restartBtn, loadBtn);
            }
        }

        function monsterPerformAttack(attacker) {
            if (player.isDead) return; 
            const angle = Phaser.Math.Angle.Between(attacker.x, attacker.y, player.x, player.y); 
            attacker.setFlipX(Math.cos(angle) < 0); 
            safePlayAnim(attacker, attacker.texture.key + '-attack', true);
            
            if (!attacker.isRanged && !attacker.isBoss) {
                mainScene.tweens.add({ targets: attacker, x: attacker.x + Math.cos(angle) * 14, y: attacker.y + Math.sin(angle) * 14, duration: 95, yoyo: true });
            }
            
            let isEvaded = Math.random() < (player.er * 0.01);
            if (isEvaded) { showFloatingText('Miss', player, '#aaaaaa'); return; }
            
            let rawDamage = Phaser.Math.Between(attacker.minDmg, attacker.maxDmg);
            let finalDamage = rawDamage - player.def; if(finalDamage < 1) finalDamage = 1; 
            
            if (attacker.isBoss) {
                spawnCastMuzzleEffect(mainScene, attacker.x, attacker.y, angle, 'boss_fireball');
                let bossProj = mainScene.physics.add.sprite(attacker.x + Math.cos(angle) * 20, attacker.y - 6 + Math.sin(angle) * 20, 'fireball').setScale(0.82); 
                bossProj.setDepth(9999);
                bossProj.damage = finalDamage; 
                bossProj.vfxType = 'boss_fireball';
                if (Phaser.BlendModes) bossProj.setBlendMode(Phaser.BlendModes.ADD);
                safePlayAnim(bossProj, 'fireball-fly'); 
                bossProj.setRotation(angle); mainScene.physics.velocityFromRotation(angle, 380, bossProj.body.velocity); 
                enemyProjectiles.push(bossProj);
            } else if (attacker.isRanged) {
                let projImage = attacker.projectile || 'eff_magicarrow';
                let pScale = (projImage === 'arrow') ? 0.62 : (attacker.projScale || 0.55);
                let mProj = mainScene.physics.add.sprite(attacker.x + Math.cos(angle) * 14, attacker.y - 4 + Math.sin(angle) * 14, projImage).setScale(pScale);
                mProj.setDepth(9999);
                mProj.damage = finalDamage;
                mProj.vfxType = (projImage === 'arrow') ? 'elf_arrow' : 'mage_bolt';
                if (projImage === 'eff_magicarrow') {
                    safePlayAnim(mProj, 'play_magicarrow');
                } else if (projImage === 'arrow') {
                    safePlayAnim(mProj, 'arrow-fly');
                }
                mProj.setRotation(angle); 
                mainScene.physics.velocityFromRotation(angle, 420, mProj.body.velocity); 
                enemyProjectiles.push(mProj);
            } else { 
                playerTakeDamage(finalDamage); 
            }
        }

        function quickUseItem(type) { if(!isPlaying || !player || player.isDead) return; let index = player.inventory.findIndex(slot => slot && slot.id === type); if (index !== -1) useItemAtIndex(index); }
        function showFloatingText(text, target, textColor) { let floatText = mainScene.add.text(target.x, target.y - 15, text, { fontSize: '22px', fill: textColor, fontStyle: 'bold', stroke: '#000000', strokeThickness: 3 }).setOrigin(0.5).setDepth(9999); mainScene.tweens.add({ targets: floatText, y: target.y - 50, alpha: 0, duration: 800, ease: 'Power1', onComplete: function () { floatText.destroy(); } }); }

        // ================= 畫面正下方 8 格魔法熱鍵列 (支援拖曳配置、點擊選取與【切換】鈕循環切換) =================
        function getMagicHotkeySlotPos(slotIdx) {
            const startX = 205;
            const spacing = 38;
            const y = 558;
            return { x: startX + slotIdx * spacing, y: y, size: 35 };
        }

        function getMagicHotkeySlotAtScreenPos(x, y) {
            for (let i = 0; i < MAGIC_HOTKEY_COUNT; i++) {
                const pos = getMagicHotkeySlotPos(i);
                const half = pos.size / 2 + 3;
                if (x >= pos.x - half && x <= pos.x + half && y >= pos.y - half && y <= pos.y + half) {
                    return i;
                }
            }
            return -1;
        }

        function selectMagicHotkeySlot(slotIdx, showToast = true) {
            if (!player || slotIdx < 0 || slotIdx >= MAGIC_HOTKEY_COUNT) return;
            currentHotkeyIndex = slotIdx;
            const spId = player.magicHotkeys ? player.magicHotkeys[currentHotkeyIndex] : null;
            if (showToast) {
                if (spId && MagicDict[spId]) {
                    showFloatingText(`切換熱鍵 ${slotIdx + 1}：【${MagicDict[spId].name}】`, player, '#00ffff');
                } else {
                    showFloatingText(`切換至魔法熱鍵 ${slotIdx + 1} (空)`, player, '#aaaaaa');
                }
            }
            updateMagicHotkeyBarUI();
            if (isMagicOpen) updateMagicUI();
        }

        function cycleNextMagicHotkey() {
            if (!player || !player.magicHotkeys) return;
            // 若熱鍵列已有配置的魔法，優先在有配置魔法的熱鍵格之間循環切換；若全空則依序 1~8 切換
            const filledIndices = [];
            for (let i = 0; i < MAGIC_HOTKEY_COUNT; i++) {
                if (player.magicHotkeys[i] && MagicDict[player.magicHotkeys[i]]) {
                    filledIndices.push(i);
                }
            }
            if (filledIndices.length > 0) {
                let nextSlot = filledIndices[0];
                for (let k = 0; k < filledIndices.length; k++) {
                    if (filledIndices[k] > currentHotkeyIndex) {
                        nextSlot = filledIndices[k];
                        break;
                    }
                }
                selectMagicHotkeySlot(nextSlot, true);
            } else {
                const nextIdx = (currentHotkeyIndex + 1) % MAGIC_HOTKEY_COUNT;
                selectMagicHotkeySlot(nextIdx, true);
            }
        }

        function updateMagicHotkeyBarUI() {
            if (!mainScene || !isPlaying || !player) return;
            hotkeyDynamicUI.forEach(el => { if (el && el.destroy) el.destroy(); });
            hotkeyDynamicUI = [];

            if (!Array.isArray(player.magicHotkeys) || player.magicHotkeys.length !== MAGIC_HOTKEY_COUNT) {
                player.magicHotkeys = new Array(MAGIC_HOTKEY_COUNT).fill(null);
            }

            for (let i = 0; i < MAGIC_HOTKEY_COUNT; i++) {
                const pos = getMagicHotkeySlotPos(i);
                const isSelected = (currentHotkeyIndex === i);
                const spellId = player.magicHotkeys[i];
                const spell = (spellId && MagicDict[spellId]) ? MagicDict[spellId] : null;

                const slotBg = mainScene.add.graphics().setScrollFactor(0).setDepth(20001);
                slotBg.fillStyle(isSelected ? 0x1e385c : 0x141822, 0.92);
                slotBg.lineStyle(isSelected ? 2.5 : 1.5, isSelected ? 0xffee44 : 0x556677, 0.96);
                slotBg.fillRoundedRect(pos.x - 17, pos.y - 17, 34, 34, 4);
                slotBg.strokeRoundedRect(pos.x - 17, pos.y - 17, 34, 34, 4);
                hotkeyDynamicUI.push(slotBg);

                const hitZone = mainScene.add.rectangle(pos.x, pos.y, 34, 34, 0x000000, 0.01)
                    .setScrollFactor(0).setDepth(20002).setInteractive({ useHandCursor: true });
                hitZone.on('pointerdown', (pointer, lx, ly, event) => {
                    if (event) event.stopPropagation();
                    selectMagicHotkeySlot(i, true);
                });
                hotkeyDynamicUI.push(hitZone);

                if (spell && mainScene.textures.exists(spell.icon)) {
                    const spIcon = mainScene.add.image(pos.x, pos.y, spell.icon)
                        .setScale(0.76).setScrollFactor(0).setDepth(20003).setInteractive({ draggable: true, useHandCursor: true });
                    spIcon.isSpellDragItem = true;
                    spIcon.spellId = spellId;
                    spIcon.hotkeySlotIdx = i;
                    spIcon.on('pointerdown', (pointer, lx, ly, event) => {
                        if (event) event.stopPropagation();
                        selectMagicHotkeySlot(i, true);
                    });
                    spIcon.on('pointerover', (pointer) => {
                        let p = getTooltipPos(pointer);
                        itemTooltip.setText(getMagicTooltipText(spellId));
                        itemTooltip.setPosition(p.x, p.y);
                        itemTooltip.setVisible(true);
                    });
                    spIcon.on('pointerout', () => { itemTooltip.setVisible(false); });
                    hotkeyDynamicUI.push(spIcon);
                }

                const numTxt = mainScene.add.text(pos.x - 15, pos.y - 16, `${i + 1}`, {
                    fontSize: '10px',
                    fill: isSelected ? '#ffee55' : '#aaaaaa',
                    fontStyle: 'bold',
                    stroke: '#000000',
                    strokeThickness: 2
                }).setScrollFactor(0).setDepth(20004);
                hotkeyDynamicUI.push(numTxt);
            }

            // 同步更新施法鍵上方與施法鍵提示
            const activeSpellId = player.magicHotkeys[currentHotkeyIndex];
            if (magicAtkSpellLabel) {
                if (activeSpellId && MagicDict[activeSpellId]) {
                    magicAtkSpellLabel.setText(MagicDict[activeSpellId].name.substring(0, 4));
                } else {
                    magicAtkSpellLabel.setText(`熱鍵${currentHotkeyIndex + 1}`);
                }
            }
        }

        let magicAtkSpellLabel = null;

        function createMobileUI() {
            let atkBtn = mainScene.add.circle(730, 530, 45, 0xff8800, 0.8).setScrollFactor(0).setDepth(20000).setInteractive();
            let atkText = mainScene.add.text(730, 530, '攻擊', { fontSize: '24px', fill: '#FFF', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            
            let potionBtn = mainScene.add.circle(640, 540, 35, potionColors[currentPotionIndex], 0.7).setScrollFactor(0).setDepth(20000).setInteractive();
            let potionText = mainScene.add.text(640, 540, potionNames[currentPotionIndex], { fontSize: '18px', fill: potionTextColors[currentPotionIndex], fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            
            let swapBtn = mainScene.add.circle(640, 480, 20, 0x555555, 0.8).setScrollFactor(0).setDepth(20000).setInteractive();
            let swapText = mainScene.add.text(640, 480, '切換', { fontSize: '12px', fill: '#FFF', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            
            let magicAtkBtn = mainScene.add.circle(550, 540, 35, 0x0066ff, 0.7).setScrollFactor(0).setDepth(20000).setInteractive();
            let magicAtkTextLabel = mainScene.add.text(550, 532, '施法', { fontSize: '17px', fill: '#FFF', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            magicAtkSpellLabel = mainScene.add.text(550, 553, '熱鍵1', { fontSize: '10px', fill: '#ffee77', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            
            // 施法鍵上方的「切換」鈕：直接在下方 8 格魔法熱鍵之間切換要使用的魔法
            let swapMagicBtn = mainScene.add.circle(550, 480, 20, 0x5555aa, 0.85).setScrollFactor(0).setDepth(20000).setInteractive();
            magicTextVisual = mainScene.add.text(550, 480, '切換', { fontSize: '12px', fill: '#FFF', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            magicBtnVisual = magicAtkBtn;

            // 畫面中間最下方：8 格魔法熱鍵底座與標題
            let hotkeyBarBg = mainScene.add.graphics().setScrollFactor(0).setDepth(20000);
            hotkeyBarBg.fillStyle(0x0a0d14, 0.86);
            hotkeyBarBg.lineStyle(2, 0xc8a448, 0.9);
            hotkeyBarBg.fillRoundedRect(181, 535, 314, 46, 6);
            hotkeyBarBg.strokeRoundedRect(181, 535, 314, 46, 6);
            let hotkeyBarTitle = mainScene.add.text(338, 523, '魔 法 熱 鍵 (可從魔法書拖曳至此)', {
                fontSize: '11px', fill: '#ffe088', fontStyle: 'bold', stroke: '#000000', strokeThickness: 3
            }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);

            atkBtn.on('pointerdown', function(pointer, localX, localY, event) {
                event.stopPropagation(); atkBtn.setAlpha(1);
                if (!isPlaying || !player || player.isDead) return;
                if (!targetEntity || targetEntity.isDead) {
                    let nearest = null; let minDist = 450; 
                    for (let i = 0; i < monsters.length; i++) {
                        let m = monsters[i]; if (m.isDead) continue;
                        let d = Phaser.Math.Distance.Between(player.x, player.y, m.x, m.y);
                        if (d < minDist) { minDist = d; nearest = m; }
                    }
                    if (nearest) { targetEntity = nearest; targetPoint = new Phaser.Math.Vector2(nearest.x, nearest.y); }
                }
                if (targetEntity && !targetEntity.isDead) {
                    let d = Phaser.Math.Distance.Between(player.x, player.y, targetEntity.x, targetEntity.y);
                    if (d <= player.attackRange) {
                        player.body.reset(player.x, player.y); targetPoint = null;
                        isAttacking = true;
                        let now = mainScene.time.now;
                        if (now >= player.lastAttackTime + player.attackSpeed) {
                            player.lastAttackTime = now; performAttack();
                        }
                    } else {
                        targetPoint = new Phaser.Math.Vector2(targetEntity.x, targetEntity.y);
                        mainScene.physics.moveToObject(player, targetPoint, player.speed);
                        player.setFlipX(targetPoint.x < player.x); isAttacking = false; safePlayAnim(player, player.playerClass + '-walk');
                    }
                } else {
                    let now = mainScene.time.now;
                    if (!isAttacking && now >= player.lastAttackTime + player.attackSpeed) {
                        player.lastAttackTime = now;
                        safePlayAnim(player, player.playerClass + '-attack', true);
                        let wId = (player.equipment.weapon && player.equipment.weapon.id) ? player.equipment.weapon.id : null;
                        let wType = (wId && ItemDict[wId]) ? ItemDict[wId].weaponType : 'melee';
                        if (wType === 'melee') {
                            spawnSlashArcEffect(mainScene, player.x, player.y, player.flipX ? Math.PI : 0, player.playerClass, wId);
                        }
                    }
                }
            });
            atkBtn.on('pointerup', () => atkBtn.setAlpha(0.8)); atkBtn.on('pointerout', () => atkBtn.setAlpha(0.8));

            potionBtn.on('pointerdown', function(pointer, localX, localY, event) { event.stopPropagation(); potionBtn.setAlpha(1); quickUseItem(potionTypes[currentPotionIndex]); });
            potionBtn.on('pointerup', () => potionBtn.setAlpha(0.7)); potionBtn.on('pointerout', () => potionBtn.setAlpha(0.7));

            swapBtn.on('pointerdown', function(pointer, localX, localY, event) { 
                event.stopPropagation(); swapBtn.setAlpha(1); 
                currentPotionIndex = (currentPotionIndex + 1) % potionTypes.length;
                potionBtn.setFillStyle(potionColors[currentPotionIndex], 0.7);
                potionText.setText(potionNames[currentPotionIndex]);
                potionText.setColor(potionTextColors[currentPotionIndex]);
            });
            swapBtn.on('pointerup', () => swapBtn.setAlpha(0.8)); swapBtn.on('pointerout', () => swapBtn.setAlpha(0.8));

            magicAtkBtn.on('pointerdown', function(pointer, localX, localY, event) { 
                event.stopPropagation(); magicAtkBtn.setAlpha(1); 
                performMagicAttack();
            });
            magicAtkBtn.on('pointerup', () => magicAtkBtn.setAlpha(0.7)); magicAtkBtn.on('pointerout', () => magicAtkBtn.setAlpha(0.7));

            swapMagicBtn.on('pointerdown', function(pointer, localX, localY, event) { 
                event.stopPropagation(); swapMagicBtn.setAlpha(1); 
                cycleNextMagicHotkey();
            });
            swapMagicBtn.on('pointerup', () => swapMagicBtn.setAlpha(0.85)); swapMagicBtn.on('pointerout', () => swapMagicBtn.setAlpha(0.85));

            // 上方選單列 (已移除「商店」熱鍵，僅保留 紀錄、魔法、屬性、背包；購買物品需回出生地的武器藥水商店)
            let invBtn = mainScene.add.rectangle(730, 40, 60, 40, 0x444444, 0.8).setScrollFactor(0).setDepth(20000).setInteractive();
            let invText = mainScene.add.text(730, 40, '背包', { fontSize: '16px', fill: '#FFF', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            invBtn.on('pointerdown', function(pointer, localX, localY, event) { event.stopPropagation(); toggleInventory(); });

            let statsBtn = mainScene.add.rectangle(660, 40, 60, 40, 0x444444, 0.8).setScrollFactor(0).setDepth(20000).setInteractive();
            let statsText = mainScene.add.text(660, 40, '屬性', { fontSize: '16px', fill: '#FFF', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            statsBtn.on('pointerdown', function(pointer, localX, localY, event) { event.stopPropagation(); toggleStats(); });

            let magicMenuBtn = mainScene.add.rectangle(590, 40, 60, 40, 0x444444, 0.8).setScrollFactor(0).setDepth(20000).setInteractive();
            let magicMenuText = mainScene.add.text(590, 40, '魔法', { fontSize: '16px', fill: '#00ccff', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            magicMenuBtn.on('pointerdown', function(pointer, localX, localY, event) { event.stopPropagation(); toggleMagic(); });
            
            let saveBtn = mainScene.add.rectangle(520, 40, 60, 40, 0x444444, 0.8).setScrollFactor(0).setDepth(20000).setInteractive();
            let saveText = mainScene.add.text(520, 40, '紀錄', { fontSize: '16px', fill: '#00ff00', fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(20000);
            saveBtn.on('pointerdown', function(pointer, localX, localY, event) { event.stopPropagation(); saveGame(); });

            let joyBase = mainScene.add.circle(105, 495, 58, 0x444444, 0.5).setScrollFactor(0).setDepth(20000); 
            let joyThumb = mainScene.add.circle(105, 495, 28, 0xaaaaaa, 0.8).setScrollFactor(0).setDepth(20001).setInteractive({ draggable: true });
            
            joyThumb.on('dragstart', function () { 
                joystickActive = true; 
                targetPoint = null; 
                targetEntity = null; 
                pendingNpcAction = null;
                isAttacking = false; 
            }); 
            joyThumb.on('drag', function (pointer, dragX, dragY) { 
                let dist = Phaser.Math.Distance.Between(105, 495, dragX, dragY); 
                joystickAngle = Phaser.Math.Angle.Between(105, 495, dragX, dragY); 
                if (dist > 58) { 
                    joyThumb.x = 105 + Math.cos(joystickAngle) * 58; 
                    joyThumb.y = 495 + Math.sin(joystickAngle) * 58; 
                } else { 
                    joyThumb.x = dragX; 
                    joyThumb.y = dragY; 
                } 
            });
            joyThumb.on('dragend', function () { 
                joystickActive = false; 
                joyThumb.x = 105; 
                joyThumb.y = 495; 
                if(player && player.active && !player.isDead && !isAttacking && player.body) { 
                    player.body.setVelocity(0); 
                    player.anims.stop(); 
                    if (player.texture && player.texture.frameTotal > 1) player.setFrame(0); 
                } 
            });

            mobileUIElements.push(
                atkBtn, atkText, potionBtn, potionText, swapBtn, swapText,
                magicAtkBtn, magicAtkTextLabel, magicAtkSpellLabel, swapMagicBtn, magicTextVisual,
                hotkeyBarBg, hotkeyBarTitle,
                invBtn, invText, statsBtn, statsText,
                magicMenuBtn, magicMenuText, saveBtn, saveText, joyBase, joyThumb
            );

            updateMagicHotkeyBarUI();
        }

        // 先將 map_assets.js 內嵌的所有圖片 (角色、怪物、道具、特效、地圖材質) 解碼為 HTMLImageElement，同步更新視覺化載入進度條，再啟動 Phaser
        (function bootLineageGame() {
            const allAssets = window.LineageAllAssets || {};
            const keys = Object.keys(allAssets);
            const totalCount = keys.length;
            if (totalCount === 0) {
                updatePreloaderUI(45, '正在啟動遊戲引擎...');
                window.game = new Phaser.Game(config);
                return;
            }
            updatePreloaderUI(5, `正在解碼亞丁大陸美術資源 (0 / ${totalCount})...`);
            let loadedCount = 0;
            let remaining = totalCount;
            let launched = false;
            const doneOne = () => {
                loadedCount++;
                remaining--;
                const pct = 5 + Math.round((loadedCount / totalCount) * 38);
                updatePreloaderUI(pct, `正在解碼亞丁大陸美術資源 (${loadedCount} / ${totalCount})...`);
                if (remaining <= 0 && !launched) {
                    launched = true;
                    updatePreloaderUI(44, '正在初始化 Phaser 3 遊戲引擎...');
                    setTimeout(() => {
                        window.game = new Phaser.Game(config);
                    }, 30);
                }
            };
            keys.forEach(k => {
                const img = new Image();
                img.onload = () => {
                    window.DecodedImages[k] = img;
                    doneOne();
                };
                img.onerror = () => {
                    doneOne();
                };
                img.src = allAssets[k];
            });
            // 安全逾時保護
            setTimeout(() => {
                if (!launched) {
                    launched = true;
                    updatePreloaderUI(44, '正在初始化 Phaser 3 遊戲引擎...');
                    window.game = new Phaser.Game(config);
                }
            }, 4000);
        })();
    </script>
</body>
</html>
